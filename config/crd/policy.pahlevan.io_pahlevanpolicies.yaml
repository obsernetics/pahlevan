                    description: RollbackWindow specifies time window for failure
                      counting
                    type: string
                type: object
              syscallPolicy:
                description: SyscallPolicy defines syscall-specific policies
                properties:
                  allowedSyscalls:
                    description: AllowedSyscalls explicitly allows specific syscalls
                    items:
                      type: string
                    type: array
                  capabilityFilter:
                    description: CapabilityFilter filters based on Linux capabilities
                    items:
                      type: string
                    type: array
                  defaultAction:
                    description: DefaultAction specifies default action for unknown
                      syscalls
                    enum:
                    - Allow
                    - Deny
                    - Alert
                    - Audit
                    type: string
                  deniedSyscalls:
                    description: DeniedSyscalls explicitly denies specific syscalls
                    items:
                      type: string
                    type: array
                  processFilter:
                    description: ProcessFilter filters based on process attributes
                    properties:
                      commands:
                        description: Commands specifies allowed command patterns
                        items:
                          type: string
                        type: array
                      groups:
                        description: Groups specifies allowed groups
                        items:
                          type: string
                        type: array
                      parentProcesses:
                        description: ParentProcesses specifies allowed parent processes
                        items:
                          type: string
                        type: array
                      users:
                        description: Users specifies allowed users
                        items:
                          type: string
                        type: array
                    type: object
                type: object
            required:
            - selector
            type: object
          status:
            description: PahlevanPolicyStatus defines the observed state of PahlevanPolicy
            properties:
              attackSurface:
                description: AttackSurface provides current attack surface analysis
                properties:
                  capabilities:
                    description: Capabilities lists effective capabilities
                    items:
                      type: string
                    type: array
                  exposedPorts:
                    description: ExposedPorts lists exposed network ports
                    items:
                      format: int32
                      type: integer
                    type: array
                  exposedSyscalls:
                    description: ExposedSyscalls lists exposed syscalls
                    items:
                      type: string
                    type: array
                  lastAnalysis:
                    description: LastAnalysis indicates when analysis was last performed
                    format: date-time
                    type: string
                  riskScore:
                    description: |-
                      RiskScore provides overall risk score, 0 to 100.

                      Bounded for the same reason as Progress: it is the Risk printer column,
                      and the analyzer's arithmetic has no upper clamp of its own.
                    format: int32
                    maximum: 100
                    minimum: 0
                    type: integer
                  writableFiles:
                    description: WritableFiles lists writable file paths
                    items:
                      type: string
                    type: array
                type: object
              conditions:
                description: |-
                  Conditions represents the latest available observations.

                  Declared a map list keyed by type, which is what the controller has
                  always meant: updateCondition searches for the entry with a matching
                  type and replaces it. The schema did not say so, so server-side apply
                  merged the array by position instead, and two writers updating different
                  conditions overwrote each other's entries rather than merging them.
                items:
                  description: PolicyCondition describes a condition of policy execution
                  properties:
                    lastTransitionTime:
                      description: LastTransitionTime is the last time the condition
                        transitioned
                      format: date-time
                      type: string
                    message:
                      description: Message contains a human readable message indicating
                        details
                      type: string
                    reason:
                      description: Reason contains a programmatic identifier indicating
                        the reason
                      type: string
                    status:
                      description: Status of the condition
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: Type of the condition
                      enum:
                      - Ready
                      - Learning
                      - Enforcing
                      - Healthy
                      - Error
                      type: string
                  required:
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              enforcementStatus:
                description: EnforcementStatus provides enforcement status
                properties:
                  alertsGenerated:
                    description: AlertsGenerated indicates alerts generated count
                    format: int64
                    type: integer
                  blockedCapabilities:
                    description: BlockedCapabilities indicates capability checks denied
                      in-kernel.
                    format: int64
                    type: integer
                  blockedExecs:
                    description: BlockedExecs indicates execve calls denied in-kernel.
                    format: int64
                    type: integer
                  blockedFileAccess:
                    description: BlockedFileAccess indicates file opens denied in-kernel.
                    format: int64
                    type: integer
                  blockedNetworkConnections:
                    description: BlockedNetworkConnections indicates connect() calls
                      denied in-kernel.
                    format: int64
                    type: integer
                  blockedTotal:
                    description: |-
                      BlockedTotal is the sum of every in-kernel denial across the containers
                      this policy governs. It exists so the printed column reports the whole
                      picture rather than one signal.
                    format: int64
                    type: integer
                  enforcingContainers:
                    description: |-
                      EnforcingContainers and TotalContainers describe how many of the
                      containers this policy selects have actually reached enforcement.
                    format: int32
                    type: integer
                  rollbackCount:
                    description: RollbackCount indicates number of rollbacks performed
                    format: int32
                    type: integer
                  startTime:
                    description: StartTime indicates when enforcement started
                    format: date-time
                    type: string
                  totalContainers:
                    format: int32
                    type: integer
                type: object
              lastUpdated:
                description: LastUpdated indicates when status was last updated
                format: date-time
                type: string
              learningStatus:
                description: LearningStatus provides learning phase status
                properties:
                  endTime:
                    description: EndTime indicates when learning ended
                    format: date-time
                    type: string
                  filePathsLearned:
                    description: FilePathsLearned indicates file paths learned
                    format: int32
                    type: integer
                  networkFlowsLearned:
                    description: NetworkFlowsLearned indicates network flows learned
                    format: int32
                    type: integer
                  progress:
                    description: |-
                      Progress indicates learning progress percentage.

                      Bounded, because it is printed verbatim in the Learning column of
                      `kubectl get pahlevanpolicy`. An unbounded int32 there reads as "413"
                      next to a header that says a percentage, and nothing rejects it.
                    format: int32
                    maximum: 100
                    minimum: 0
                    type: integer
                  samplesCollected:
                    description: SamplesCollected indicates samples collected
                    format: int64
                    type: integer
                  startTime:
                    description: StartTime indicates when learning started
                    format: date-time
                    type: string
                  syscallsLearned:
                    description: SyscallsLearned indicates unique syscalls learned
                    format: int32
                    type: integer
                type: object
              phase:
                description: Phase indicates the current phase of the policy
                enum:
                - Initializing
                - Learning
                - Transition
                - Enforcing
                - Failed
                - RollingBack
                type: string
              targetWorkloads:
                description: TargetWorkloads lists target workloads
                items:
                  description: WorkloadReference references a target workload
                  properties:
                    apiVersion:
                      description: APIVersion of the workload
                      type: string
                    kind:
                      description: Kind of the workload
                      type: string
                    name:
                      description: Name of the workload
                      type: string
                    namespace:
                      description: Namespace of the workload
                      type: string
                    uid:
                      description: UID of the workload
                      type: string
                  required:
                  - apiVersion
                  - kind
                  - name
                  - namespace
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
