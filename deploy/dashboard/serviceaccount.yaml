# The dashboard's own identity, separate from the agent's and the operator's.
#
# Sharing the operator's ServiceAccount would have handed a browser-facing
# process the operator's write access to every PahlevanPolicy in the cluster:
# one request-handling bug would then be a policy-deletion primitive. This
# account is bound to reads and to the two authorization reviews, and nothing
# else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pahlevan-dashboard
  namespace: pahlevan-system
  labels:
    app.kubernetes.io/name: pahlevan-dashboard
    app.kubernetes.io/part-of: pahlevan
    app.kubernetes.io/component: dashboard
