                    description: Enabled enables self-healing
                    type: boolean
                  recoveryStrategy:
                    description: RecoveryStrategy specifies recovery strategy
                    enum:
                    - Rollback
                    - Relax
                    - Maintenance
                    type: string
                  rollbackThreshold:
                    description: RollbackThreshold specifies failure threshold for
                      rollback
                    format: int32
                    minimum: 0
                    type: integer
                  rollbackWindow:
                    description: RollbackWindow specifies time window for failure
                      counting
                    type: string
                type: object
              syscallPolicy:
                description: SyscallPolicy defines syscall-specific policies
                properties:
                  allowedSyscalls:
                    description: AllowedSyscalls explicitly allows specific syscalls
                    items:
                      type: string
                    type: array
                  capabilityFilter:
                    description: CapabilityFilter filters based on Linux capabilities
                    items:
                      type: string
                    type: array
                  defaultAction:
                    description: DefaultAction specifies default action for unknown
                      syscalls
                    enum:
                    - Allow
                    - Deny
                    - Alert
