                type: string
              lastRollbackTime:
                description: LastRollbackTime is when the most recent rollback happened.
                format: date-time
                type: string
              lastUpdated:
                description: LastUpdated is when the agent last refreshed this profile.
                format: date-time
                type: string
              learnedCapabilities:
                description: |-
                  LearnedCapabilities is the set of Linux capabilities the container was
                  observed using, as names without the CAP_ prefix so they match the
                  spelling a pod spec uses in securityContext.capabilities.

                  Reported because it was otherwise the only learned signal invisible from
                  outside the agent, and because it is what lets admission reject a new
                  revision asking for privilege the workload has never needed.
                items:
                  type: string
                type: array
              learnedExecutables:
                description: LearnedExecutables is the set of binary paths the container
                  executed.
                items:
                  type: string
                type: array
              learnedFiles:
                description: LearnedFiles is the set of file paths the container opened
                  during learning.
                items:
                  type: string
                type: array
              learnedNetworkDestinations:
                description: LearnedNetworkDestinations is the set of egress destinations
                  (ip:port).
                items:
                  type: string
                type: array
              learnedSyscalls:
                description: LearnedSyscalls is the set of syscall numbers observed
                  during learning.
                items:
                  format: int64
                  type: integer
                type: array
              networkCount:
                format: int32
                type: integer
              phase:
                description: Phase is Learning or Enforcing.
                type: string
              rollbackCount:
                description: |-
                  RollbackCount is how many times self-healing returned this container from
                  enforcing to learning because the learned baseline was breaking it.
                format: int32
                type: integer
              seccomp:
                description: |-
                  Seccomp describes the profile generated from LearnedSyscalls, if the
                  agent was configured to emit one.
                properties:
                  allowedSyscalls:
                    description: |-
                      AllowedSyscalls is how many syscalls the profile permits, including the
                      safety baseline. TotalSyscalls is the size of the architecture's syscall
                      table, so the pair states the privilege reduction without arithmetic.
                    format: int32
                    type: integer
                  generatedAt:
                    description: GeneratedAt is when the profile was last written.
                    format: date-time
                    type: string
                  localhostProfile:
                    description: |-
                      LocalhostProfile is the value to put in the pod's
                      securityContext.seccompProfile.localhostProfile. It is relative to the
                      kubelet's seccomp root, which is what that field expects.
                    type: string
                  node:
                    description: |-
                      Node is the node the file lives on. The profile is written by each node's
                      agent, so it exists only where that container ran.
                    type: string
                  path:
                    description: Path is the absolute path on the node, for debugging.
                    type: string
                  skippedUnknown:
                    description: |-
