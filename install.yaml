                    maximum: 100
                    minimum: 0
                    type: integer
                  samplesCollected:
                    description: SamplesCollected indicates samples collected
                    format: int64
                    type: integer
                  startTime:
                    description: StartTime indicates when learning started
                    format: date-time
                    type: string
                  syscallsLearned:
                    description: SyscallsLearned indicates unique syscalls learned
                    format: int32
                    type: integer
                type: object
              phase:
                description: Phase indicates the current phase of the policy
                enum:
                - Initializing
                - Learning
                - Transition
                - Enforcing
                - Failed
                - RollingBack
                type: string
              targetWorkloads:
                description: TargetWorkloads lists target workloads
                items:
                  description: WorkloadReference references a target workload
