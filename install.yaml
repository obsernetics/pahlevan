---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pahlevan-agent
  namespace: pahlevan-system
  labels:
    app.kubernetes.io/name: pahlevan-agent
    app.kubernetes.io/part-of: pahlevan
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pahlevan-operator
  namespace: pahlevan-system
  labels:
    app.kubernetes.io/name: pahlevan-operator
    app.kubernetes.io/part-of: pahlevan

---
# RBAC is split by component. The agent (data plane) needs to read policies and
# the pods on its node and report status. The operator (control plane) owns policy
# lifecycle, leader-election leases, and admission policy.

# ---------------------------------------------------------------------------
# Agent: read policies + pods/nodes, write policy status, emit events.
# ---------------------------------------------------------------------------
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pahlevan-agent
  labels:
    app.kubernetes.io/name: pahlevan-agent
    app.kubernetes.io/part-of: pahlevan
rules:
- apiGroups: ["policy.pahlevan.io"]
  resources: ["pahlevanpolicies", "containerprofiles", "attacksurfaces"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["policy.pahlevan.io"]
  resources: ["pahlevanpolicies/status", "containerprofiles/status", "attacksurfaces/status"]
  verbs: ["get", "update", "patch"]
- apiGroups: ["policy.pahlevan.io"]
  resources: ["containerprofiles"]
  verbs: ["create", "update", "patch"]
- apiGroups: [""]
  resources: ["pods", "nodes"]
  verbs: ["get", "list", "watch"]
# namespaces back PahlevanPolicy's selector.namespaceSelector, which matches on
# the namespace's own labels.
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list", "watch"]
# The agent runs AttackSurfaceAnalyzerReconciler, which Owns() these and lists
# them. Without the grant its informers never sync and the manager exits after
# the cache timeout: measured as four restarts in ten minutes, each one wiping
# the learned baseline, with the agent observed enforcing a baseline of a
# single file. Read-only, because the agent never writes them.
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets", "daemonsets", "statefulsets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pahlevan-agent
  labels:
    app.kubernetes.io/name: pahlevan-agent
    app.kubernetes.io/part-of: pahlevan
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pahlevan-agent
subjects:
- kind: ServiceAccount
  name: pahlevan-agent
  namespace: pahlevan-system
---
# ---------------------------------------------------------------------------
# Operator: full policy lifecycle + aggregation + admission policy.
# ---------------------------------------------------------------------------
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pahlevan-operator
  labels:
    app.kubernetes.io/name: pahlevan-operator
    app.kubernetes.io/part-of: pahlevan
rules:
- apiGroups: ["policy.pahlevan.io"]
  resources: ["pahlevanpolicies", "containerprofiles", "attacksurfaces"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["policy.pahlevan.io"]
  resources: ["pahlevanpolicies/status", "containerprofiles/status", "attacksurfaces/status"]
  verbs: ["get", "update", "patch"]
- apiGroups: [""]
  resources: ["pods", "nodes", "namespaces", "services"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets", "daemonsets", "statefulsets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
# CEL ValidatingAdmissionPolicy lifecycle (replaces the legacy webhook).
- apiGroups: ["admissionregistration.k8s.io"]
  resources: ["validatingadmissionpolicies", "validatingadmissionpolicybindings"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pahlevan-operator
  labels:
    app.kubernetes.io/name: pahlevan-operator
    app.kubernetes.io/part-of: pahlevan
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pahlevan-operator
subjects:
- kind: ServiceAccount
  name: pahlevan-operator
  namespace: pahlevan-system
---
# Leader-election lease (namespaced) for the operator.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pahlevan-operator-leader-election
  namespace: pahlevan-system
  labels:
    app.kubernetes.io/name: pahlevan-operator
    app.kubernetes.io/part-of: pahlevan
rules:
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pahlevan-operator-leader-election
  namespace: pahlevan-system
  labels:
    app.kubernetes.io/name: pahlevan-operator
    app.kubernetes.io/part-of: pahlevan
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pahlevan-operator-leader-election
subjects:
- kind: ServiceAccount
  name: pahlevan-operator
  namespace: pahlevan-system

---
# The agent runs on EVERY node as a privileged DaemonSet - this is the shape a
# node-level eBPF security tool must take. A
# single-replica Deployment can only instrument the one node it lands on.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: pahlevan-agent
  namespace: pahlevan-system
  labels:
    app.kubernetes.io/name: pahlevan-agent
    app.kubernetes.io/part-of: pahlevan
    app.kubernetes.io/component: node-agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: pahlevan-agent
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pahlevan-agent
        app.kubernetes.io/part-of: pahlevan
        app.kubernetes.io/component: node-agent
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: pahlevan-agent
      # Host PID namespace is required to resolve the host PIDs seen in kernel
      # events back to processes/containers.
      hostPID: true
      hostNetwork: false
      hostIPC: false
      # Priority so the security agent is not evicted under node pressure.
      priorityClassName: system-node-critical
      terminationGracePeriodSeconds: 30
      containers:
      - name: agent
        image: ghcr.io/obsernetics/pahlevan:v3.3.3
        imagePullPolicy: IfNotPresent
        command: ["/usr/local/bin/pahlevan-agent"]
        args:
        - --metrics-bind-address=:8080
        - --health-probe-bind-address=:8081
        - --learning-window=5m
        - --enforcement-delay=30s
        - --observability-exports=prometheus,otel
        # Generated seccomp profiles are written under the kubelet's seccomp
        # root so the kubelet can actually resolve them as a localhostProfile.
        # Writing them anywhere else produces a file nothing can reference.
        - --seccomp-root=/var/lib/kubelet/seccomp
        - --seccomp-dir=/var/lib/kubelet/seccomp/pahlevan
        # The gRPC event stream is off by default: the stream carries every
        # denial on this node - which pods exist, which paths they read, which
        # destinations they dial, the command line of every exec - so anything
        # that can reach the port receives a reconnaissance report.
        #
        # Enabling it requires credentials. The agent refuses to start a
        # plaintext, unauthenticated listener unless --grpc-insecure is passed
        # on purpose. Uncomment the bind address, add the port below, and
        # configure one of:
        #
        #   mTLS (use this in a cluster; cert-manager can issue the pair):
        # - --grpc-tls-cert=/etc/pahlevan/tls/tls.crt
        # - --grpc-tls-key=/etc/pahlevan/tls/tls.key
        # - --grpc-client-ca=/etc/pahlevan/tls/ca.crt
        #
        #   or TLS plus a bearer token, for a collector that cannot present a
        #   certificate (the token is refused over plaintext, because a token on
        #   an unencrypted connection is a token you have published):
        # - --grpc-token=$(PAHLEVAN_GRPC_TOKEN)
        # - --grpc-bind-address=:9090
        securityContext:
          # eBPF program load/attach and LSM/seccomp enforcement need real
          # privilege in the init namespace. CAP_BPF + CAP_PERFMON is the modern
          # least-privilege set (kernel >= 5.8); SYS_ADMIN/SYS_RESOURCE cover
          # older kernels and map operations. This container CANNOT run in a user
          # namespace - that is what the operator (separate Deployment) is for.
          privileged: false
          runAsNonRoot: false
          runAsUser: 0
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - BPF
            - PERFMON
            - SYS_ADMIN
            - SYS_RESOURCE
            - NET_ADMIN
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        ports:
        - name: metrics
          containerPort: 8080
        - name: health
          containerPort: 8081
        # Uncomment alongside --grpc-bind-address above.
        # - name: grpc
        #   containerPort: 9090
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 10
        env:
        - name: PAHLEVAN_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: PAHLEVAN_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        # The namespace completes the OpenTelemetry resource. Grafana joins
        # Loki, Tempo and Mimir on shared labels, so the agent's metrics,
        # traces and events must agree on k8s.namespace.name, k8s.pod.name and
        # k8s.node.name - a resource that disagrees makes the join silently
        # return nothing, which looks exactly like no data.
        - name: PAHLEVAN_POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: GOMAXPROCS
          valueFrom:
            resourceFieldRef:
              resource: limits.cpu
        volumeMounts:
        - name: bpffs
          mountPath: /sys/fs/bpf
          mountPropagation: Bidirectional
        - name: btf
          mountPath: /sys/kernel/btf
          readOnly: true
        - name: debugfs
          mountPath: /sys/kernel/debug
        - name: cgroup
          mountPath: /sys/fs/cgroup
          readOnly: true
        - name: proc
          mountPath: /host/proc
          readOnly: true
        # Writable, and deliberately scoped to pahlevan's own subdirectory
        # rather than the whole seccomp root: the agent needs to create the
        # profiles it generates and nothing else there.
        - name: seccomp-profiles
          mountPath: /var/lib/kubelet/seccomp/pahlevan
      volumes:
      - name: bpffs
        hostPath:
          path: /sys/fs/bpf
          type: DirectoryOrCreate
      - name: seccomp-profiles
        hostPath:
          path: /var/lib/kubelet/seccomp/pahlevan
          type: DirectoryOrCreate
      - name: btf
        hostPath:
          path: /sys/kernel/btf
          type: Directory
      - name: debugfs
        hostPath:
          path: /sys/kernel/debug
          type: DirectoryOrCreate
      - name: cgroup
        hostPath:
          path: /sys/fs/cgroup
          type: Directory
      - name: proc
        hostPath:
          path: /proc
          type: Directory
      nodeSelector:
        kubernetes.io/os: linux
      # Run on all nodes, including control-plane.
      tolerations:
      - operator: Exists

---
# The operator is the control plane: no host access, no eBPF, no privilege. It is
# therefore a great fit for a user namespace (hostUsers: false), which maps its
# root to an unprivileged host UID and shrinks blast radius. Leader election keeps
# a single active replica while running 2 for availability.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pahlevan-operator
  namespace: pahlevan-system
  labels:
    app.kubernetes.io/name: pahlevan-operator
    app.kubernetes.io/part-of: pahlevan
    app.kubernetes.io/component: control-plane
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: pahlevan-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pahlevan-operator
        app.kubernetes.io/part-of: pahlevan
        app.kubernetes.io/component: control-plane
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: pahlevan-operator
      # User namespaces (KEP-127, GA in recent Kubernetes): the operator's
      # in-container root maps to an unprivileged UID on the host.
      hostUsers: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: operator
        image: ghcr.io/obsernetics/pahlevan:v3.3.3
        imagePullPolicy: IfNotPresent
        command: ["/usr/local/bin/pahlevan-operator"]
        args:
        - --leader-elect
        - --metrics-bind-address=:8080
        - --health-probe-bind-address=:8081
        - --observability-exports=prometheus,otel
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        ports:
        - name: metrics
          containerPort: 8080
        - name: health
          containerPort: 8081
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 10
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: pahlevan-operator
              topologyKey: kubernetes.io/hostname
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule

---
apiVersion: v1
kind: Service
metadata:
  name: pahlevan-agent-metrics
  namespace: pahlevan-system
  labels:
    app.kubernetes.io/name: pahlevan-agent
    app.kubernetes.io/part-of: pahlevan
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - name: metrics
    port: 8080
    targetPort: metrics
  selector:
    app.kubernetes.io/name: pahlevan-agent
---
apiVersion: v1
kind: Service
metadata:
  name: pahlevan-operator-metrics
  namespace: pahlevan-system
  labels:
    app.kubernetes.io/name: pahlevan-operator
    app.kubernetes.io/part-of: pahlevan
spec:
  type: ClusterIP
  ports:
  - name: metrics
    port: 8080
    targetPort: metrics
  selector:
    app.kubernetes.io/name: pahlevan-operator

