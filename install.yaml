                        items:
                          type: string
                        type: array
                      groups:
                        description: Groups specifies allowed groups
                        items:
                          type: string
                        type: array
                      parentProcesses:
                        description: ParentProcesses specifies allowed parent processes
                        items:
                          type: string
                        type: array
                      users:
                        description: Users specifies allowed users
                        items:
                          type: string
                        type: array
