                type: integer
              enforcingSince:
                format: date-time
                type: string
              fileCount:
                format: int32
                type: integer
              firstSeen:
                description: FirstSeen / EnforcingSince timestamps.
                format: date-time
                type: string
              lastRollbackReason:
                description: |-
                  LastRollbackReason explains the most recent rollback (denial rate or the
