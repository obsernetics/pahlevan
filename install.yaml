                      this policy governs. It exists so the printed column reports the whole
                      picture rather than one signal.
                    format: int64
                    type: integer
                  enforcingContainers:
                    description: |-
                      EnforcingContainers and TotalContainers describe how many of the
                      containers this policy selects have actually reached enforcement.
                    format: int32
                    type: integer
                  rollbackCount:
                    description: RollbackCount indicates number of rollbacks performed
                    format: int32
                    type: integer
                  startTime:
                    description: StartTime indicates when enforcement started
                    format: date-time
                    type: string
                  totalContainers:
                    format: int32
                    type: integer
                type: object
              lastUpdated:
                description: LastUpdated indicates when status was last updated
                format: date-time
                type: string
              learningStatus:
                description: LearningStatus provides learning phase status
                properties:
                  endTime:
                    description: EndTime indicates when learning ended
                    format: date-time
                    type: string
                  filePathsLearned:
                    description: FilePathsLearned indicates file paths learned
