# Pahlevan - all-in-one install manifest.
# Generated by scripts/gen-install.sh from deploy/base + config/crd.
# Deploys: namespace, CRD, RBAC, agent DaemonSet, operator Deployment.
---
apiVersion: v1
kind: Namespace
metadata:
  name: pahlevan-system
  labels:
    app.kubernetes.io/name: pahlevan
    app.kubernetes.io/part-of: pahlevan
    # Pod Security Admission: the agent runs privileged (eBPF), so the namespace
    # is labelled privileged. Workloads Pahlevan protects live in their own
    # namespaces and are unaffected by this.
    pod-security.kubernetes.io/enforce: privileged

---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: pahlevanpolicies.policy.pahlevan.io
  annotations:
    controller-gen.kubebuilder.io/version: v0.13.0
  labels:
    app.kubernetes.io/name: pahlevan-operator
    app.kubernetes.io/component: crd
spec:
  group: policy.pahlevan.io
  names:
    kind: PahlevanPolicy
    listKind: PahlevanPolicyList
    plural: pahlevanpolicies
    singular: pahlevanpolicy
    shortNames:
    - pp
    - pahlevan
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        description: PahlevanPolicy is the Schema for the pahlevanpolicies API
        type: object
        properties:
          apiVersion:
            description: 'APIVersion defines the versioned schema of this representation of an object.'
            type: string
          kind:
            description: 'Kind is a string value representing the REST resource this object represents.'
            type: string
          metadata:
            type: object
          spec:
            description: PahlevanPolicySpec defines the desired state of PahlevanPolicy
            type: object
            properties:
              selector:
                description: Selector specifies the target workloads for this policy
                type: object
                properties:
                  matchLabels:
                    description: MatchLabels is a map of {key,value} pairs
                    type: object
                    additionalProperties:
                      type: string
                  matchExpressions:
                    description: MatchExpressions is a list of label selector requirements
                    type: array
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                        operator:
                          type: string
                          enum: ["In", "NotIn", "Exists", "DoesNotExist"]
                        values:
                          type: array
                          items:
                            type: string
              learningConfig:
                description: LearningConfig controls the learning phase behavior
                type: object
                properties:
                  duration:
                    description: Duration specifies how long to run in learning mode
                    type: string
                  windowSize:
                    description: WindowSize specifies the minimum learning window size
                    type: string
                  minSamples:
                    description: MinSamples specifies minimum number of samples before transitioning
                    type: integer
                    minimum: 1
                  autoTransition:
                    description: AutoTransition enables automatic transition to enforcement
                    type: boolean
                    default: true
                  lifecycleAware:
                    description: LifecycleAware enables lifecycle-based learning transitions
                    type: boolean
                    default: true
              enforcementConfig:
                description: EnforcementConfig controls enforcement behavior
                type: object
                properties:
                  mode:
                    description: Mode specifies the enforcement mode
                    type: string
                    enum: ["Off", "Monitoring", "Blocking"]
                    default: "Monitoring"
                  gracePeriod:
                    description: GracePeriod specifies grace period before strict enforcement
                    type: string
                  alertOnly:
                    description: AlertOnly enables alert-only mode for testing
                    type: boolean
                    default: false
                  blockUnknown:
                    description: BlockUnknown blocks unknown syscalls/access patterns
                    type: boolean
                    default: true
              syscallPolicy:
                description: SyscallPolicy defines syscall-specific policies
                type: object
                properties:
                  allowedSyscalls:
                    description: AllowedSyscalls explicitly allows specific syscalls
                    type: array
                    items:
                      type: string
                  deniedSyscalls:
                    description: DeniedSyscalls explicitly denies specific syscalls
                    type: array
                    items:
                      type: string
                  defaultAction:
                    description: DefaultAction specifies default action for unknown syscalls
                    type: string
                    enum: ["Allow", "Deny", "Alert", "Audit"]
                    default: "Deny"
              networkPolicy:
                description: NetworkPolicy defines network-specific policies
                type: object
                properties:
                  defaultAction:
                    description: DefaultAction specifies default action for unknown connections
                    type: string
                    enum: ["Allow", "Deny", "Alert", "Audit"]
                    default: "Deny"
                  allowLoopback:
                    description: AllowLoopback allows loopback traffic
                    type: boolean
                    default: true
                  allowDNS:
                    description: AllowDNS allows DNS traffic
                    type: boolean
                    default: true
              filePolicy:
                description: FilePolicy defines file access policies
                type: object
                properties:
                  allowedPaths:
                    description: AllowedPaths explicitly allows specific paths
                    type: array
                    items:
                      type: string
                  deniedPaths:
                    description: DeniedPaths explicitly denies specific paths
                    type: array
                    items:
                      type: string
                  defaultAction:
                    description: DefaultAction specifies default action for unknown paths
                    type: string
                    enum: ["Allow", "Deny", "Alert", "Audit"]
                    default: "Deny"
              selfHealing:
                description: SelfHealing enables automatic policy rollback on failures
                type: object
                properties:
                  enabled:
                    description: Enabled enables self-healing
                    type: boolean
                    default: true
                  rollbackThreshold:
                    description: RollbackThreshold specifies failure threshold for rollback
                    type: integer
                    minimum: 1
                    default: 5
                  rollbackWindow:
                    description: RollbackWindow specifies time window for failure counting
                    type: string
                    default: "10m"
                  recoveryStrategy:
                    description: RecoveryStrategy specifies recovery strategy
                    type: string
                    enum: ["Rollback", "Relax", "Maintenance"]
                    default: "Rollback"
              observabilityConfig:
                description: ObservabilityConfig controls observability exports
                type: object
                properties:
                  metrics:
                    description: Metrics controls metrics export
                    type: object
                    properties:
                      enabled:
                        type: boolean
                        default: true
                      interval:
                        type: string
                        default: "30s"
                  visualization:
                    description: Visualization controls attack surface visualization
                    type: object
                    properties:
                      enabled:
                        type: boolean
                        default: true
                      updateInterval:
                        type: string
                        default: "5m"
          status:
            description: PahlevanPolicyStatus defines the observed state of PahlevanPolicy
            type: object
            properties:
              phase:
                description: Phase indicates the current phase of the policy
                type: string
                enum: ["Initializing", "Learning", "Transition", "Enforcing", "Failed", "RollingBack"]
              conditions:
                description: Conditions represents the latest available observations
                type: array
                items:
                  type: object
                  properties:
                    type:
                      type: string
                    status:
                      type: string
                      enum: ["True", "False", "Unknown"]
                    lastTransitionTime:
                      type: string
                      format: date-time
                    reason:
                      type: string
                    message:
                      type: string
              learningStatus:
                description: LearningStatus provides learning phase status
                type: object
                properties:
                  startTime:
                    type: string
                    format: date-time
                  endTime:
                    type: string
                    format: date-time
                  samplesCollected:
                    type: integer
                  syscallsLearned:
                    type: integer
                  networkFlowsLearned:
                    type: integer
                  filePathsLearned:
                    type: integer
                  progress:
                    type: integer
                    minimum: 0
                    maximum: 100
              enforcementStatus:
                description: EnforcementStatus provides enforcement status
                type: object
                properties:
                  startTime:
                    type: string
                    format: date-time
                  blockedSyscalls:
                    type: integer
                  blockedNetworkConnections:
                    type: integer
                  blockedFileAccess:
                    type: integer
                  alertsGenerated:
                    type: integer
                  rollbackCount:
                    type: integer
              attackSurface:
                description: AttackSurface provides current attack surface analysis
                type: object
                properties:
                  exposedSyscalls:
                    type: array
                    items:
                      type: string
                  exposedPorts:
                    type: array
                    items:
                      type: integer
                  writableFiles:
                    type: array
                    items:
                      type: string
                  capabilities:
                    type: array
                    items:
                      type: string
                  riskScore:
                    type: integer
                    minimum: 0
                    maximum: 10
                  lastAnalysis:
                    type: string
                    format: date-time
              targetWorkloads:
                description: TargetWorkloads lists target workloads
                type: array
                items:
                  type: object
                  properties:
                    apiVersion:
                      type: string
                    kind:
                      type: string
                    name:
                      type: string
                    namespace:
                      type: string
                    uid:
                      type: string
              lastUpdated:
                description: LastUpdated indicates when status was last updated
                type: string
                format: date-time
    additionalPrinterColumns:
    - name: Phase
      type: string
      jsonPath: .status.phase
    - name: Learning
      type: string
      jsonPath: .status.learningStatus.progress
    - name: Blocked
      type: integer
      jsonPath: .status.enforcementStatus.blockedSyscalls
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
    subresources:
      status: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pahlevan-agent
  namespace: pahlevan-system
  labels:
    app.kubernetes.io/name: pahlevan-agent
    app.kubernetes.io/part-of: pahlevan
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pahlevan-operator
  namespace: pahlevan-system
  labels:
    app.kubernetes.io/name: pahlevan-operator
    app.kubernetes.io/part-of: pahlevan

---
# RBAC is split by component. The agent (data plane) needs to read policies and
# the pods on its node and report status. The operator (control plane) owns policy
# lifecycle, leader-election leases, and admission policy.

# ---------------------------------------------------------------------------
# Agent: read policies + pods/nodes, write policy status, emit events.
# ---------------------------------------------------------------------------
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pahlevan-agent
  labels:
    app.kubernetes.io/name: pahlevan-agent
    app.kubernetes.io/part-of: pahlevan
rules:
- apiGroups: ["policy.pahlevan.io"]
  resources: ["pahlevanpolicies", "containerprofiles", "attacksurfaces"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["policy.pahlevan.io"]
  resources: ["pahlevanpolicies/status", "containerprofiles/status", "attacksurfaces/status"]
  verbs: ["get", "update", "patch"]
- apiGroups: ["policy.pahlevan.io"]
  resources: ["containerprofiles"]
  verbs: ["create", "update", "patch"]
- apiGroups: [""]
  resources: ["pods", "nodes"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pahlevan-agent
  labels:
    app.kubernetes.io/name: pahlevan-agent
    app.kubernetes.io/part-of: pahlevan
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pahlevan-agent
subjects:
- kind: ServiceAccount
  name: pahlevan-agent
  namespace: pahlevan-system
---
# ---------------------------------------------------------------------------
# Operator: full policy lifecycle + aggregation + admission policy.
# ---------------------------------------------------------------------------
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pahlevan-operator
  labels:
    app.kubernetes.io/name: pahlevan-operator
    app.kubernetes.io/part-of: pahlevan
rules:
- apiGroups: ["policy.pahlevan.io"]
  resources: ["pahlevanpolicies", "containerprofiles", "attacksurfaces"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["policy.pahlevan.io"]
  resources: ["pahlevanpolicies/status", "containerprofiles/status", "attacksurfaces/status"]
  verbs: ["get", "update", "patch"]
- apiGroups: [""]
  resources: ["pods", "nodes", "namespaces"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
# CEL ValidatingAdmissionPolicy lifecycle (replaces the legacy webhook).
- apiGroups: ["admissionregistration.k8s.io"]
  resources: ["validatingadmissionpolicies", "validatingadmissionpolicybindings"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pahlevan-operator
  labels:
    app.kubernetes.io/name: pahlevan-operator
    app.kubernetes.io/part-of: pahlevan
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pahlevan-operator
subjects:
- kind: ServiceAccount
  name: pahlevan-operator
  namespace: pahlevan-system
---
# Leader-election lease (namespaced) for the operator.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pahlevan-operator-leader-election
  namespace: pahlevan-system
  labels:
    app.kubernetes.io/name: pahlevan-operator
    app.kubernetes.io/part-of: pahlevan
rules:
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pahlevan-operator-leader-election
  namespace: pahlevan-system
  labels:
    app.kubernetes.io/name: pahlevan-operator
    app.kubernetes.io/part-of: pahlevan
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pahlevan-operator-leader-election
subjects:
- kind: ServiceAccount
  name: pahlevan-operator
  namespace: pahlevan-system

---
# The agent runs on EVERY node as a privileged DaemonSet — this is the shape a
# node-level eBPF security tool must take (the same as Falco and Tetragon). A
# single-replica Deployment can only instrument the one node it lands on.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: pahlevan-agent
  namespace: pahlevan-system
  labels:
    app.kubernetes.io/name: pahlevan-agent
    app.kubernetes.io/part-of: pahlevan
    app.kubernetes.io/component: node-agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: pahlevan-agent
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pahlevan-agent
        app.kubernetes.io/part-of: pahlevan
        app.kubernetes.io/component: node-agent
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: pahlevan-agent
      # Host PID namespace is required to resolve the host PIDs seen in kernel
      # events back to processes/containers.
      hostPID: true
      hostNetwork: false
      hostIPC: false
      # Priority so the security agent is not evicted under node pressure.
      priorityClassName: system-node-critical
      terminationGracePeriodSeconds: 30
      containers:
      - name: agent
        image: ghcr.io/obsernetics/pahlevan:latest
        imagePullPolicy: IfNotPresent
        command: ["/usr/local/bin/pahlevan-agent"]
        args:
        - --metrics-bind-address=:8080
        - --health-probe-bind-address=:8081
        - --learning-window=5m
        - --enforcement-delay=30s
        - --observability-exports=prometheus,otel
        securityContext:
          # eBPF program load/attach and LSM/seccomp enforcement need real
          # privilege in the init namespace. CAP_BPF + CAP_PERFMON is the modern
          # least-privilege set (kernel >= 5.8); SYS_ADMIN/SYS_RESOURCE cover
          # older kernels and map operations. This container CANNOT run in a user
          # namespace — that is what the operator (separate Deployment) is for.
          privileged: false
          runAsNonRoot: false
          runAsUser: 0
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - BPF
            - PERFMON
            - SYS_ADMIN
            - SYS_RESOURCE
            - NET_ADMIN
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        ports:
        - name: metrics
          containerPort: 8080
        - name: health
          containerPort: 8081
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 10
        env:
        - name: PAHLEVAN_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: PAHLEVAN_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: GOMAXPROCS
          valueFrom:
            resourceFieldRef:
              resource: limits.cpu
        volumeMounts:
        - name: bpffs
          mountPath: /sys/fs/bpf
          mountPropagation: Bidirectional
        - name: btf
          mountPath: /sys/kernel/btf
          readOnly: true
        - name: debugfs
          mountPath: /sys/kernel/debug
        - name: cgroup
          mountPath: /sys/fs/cgroup
          readOnly: true
        - name: proc
          mountPath: /host/proc
          readOnly: true
      volumes:
      - name: bpffs
        hostPath:
          path: /sys/fs/bpf
          type: DirectoryOrCreate
      - name: btf
        hostPath:
          path: /sys/kernel/btf
          type: Directory
      - name: debugfs
        hostPath:
          path: /sys/kernel/debug
          type: DirectoryOrCreate
      - name: cgroup
        hostPath:
          path: /sys/fs/cgroup
          type: Directory
      - name: proc
        hostPath:
          path: /proc
          type: Directory
      nodeSelector:
        kubernetes.io/os: linux
      # Run on all nodes, including control-plane.
      tolerations:
      - operator: Exists

---
# The operator is the control plane: no host access, no eBPF, no privilege. It is
# therefore a great fit for a user namespace (hostUsers: false), which maps its
# root to an unprivileged host UID and shrinks blast radius. Leader election keeps
# a single active replica while running 2 for availability.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pahlevan-operator
  namespace: pahlevan-system
  labels:
    app.kubernetes.io/name: pahlevan-operator
    app.kubernetes.io/part-of: pahlevan
    app.kubernetes.io/component: control-plane
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: pahlevan-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pahlevan-operator
        app.kubernetes.io/part-of: pahlevan
        app.kubernetes.io/component: control-plane
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: pahlevan-operator
      # User namespaces (KEP-127, GA in recent Kubernetes): the operator's
      # in-container root maps to an unprivileged UID on the host.
      hostUsers: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: operator
        image: ghcr.io/obsernetics/pahlevan:latest
        imagePullPolicy: IfNotPresent
        command: ["/usr/local/bin/pahlevan-operator"]
        args:
        - --leader-elect
        - --metrics-bind-address=:8080
        - --health-probe-bind-address=:8081
        - --observability-exports=prometheus,otel
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        ports:
        - name: metrics
          containerPort: 8080
        - name: health
          containerPort: 8081
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 10
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: pahlevan-operator
              topologyKey: kubernetes.io/hostname
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule

---
apiVersion: v1
kind: Service
metadata:
  name: pahlevan-agent-metrics
  namespace: pahlevan-system
  labels:
    app.kubernetes.io/name: pahlevan-agent
    app.kubernetes.io/part-of: pahlevan
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - name: metrics
    port: 8080
    targetPort: metrics
  selector:
    app.kubernetes.io/name: pahlevan-agent
---
apiVersion: v1
kind: Service
metadata:
  name: pahlevan-operator-metrics
  namespace: pahlevan-system
  labels:
    app.kubernetes.io/name: pahlevan-operator
    app.kubernetes.io/part-of: pahlevan
spec:
  type: ClusterIP
  ports:
  - name: metrics
    port: 8080
    targetPort: metrics
  selector:
    app.kubernetes.io/name: pahlevan-operator

