                      value means the profile is narrower than what was observed.
                    format: int32
                    type: integer
                  totalSyscalls:
                    format: int32
                    type: integer
                type: object
              syscallCount:
                description: Counts for quick inspection / printcolumns.
                format: int32
                type: integer
            type: object
        type: object
