# Attack surface: what the analyzer computes and how to see it.
#
# The attack surface is a different object from the policy. The policy governs
# what a container may do; the AttackSurface CR records what it *could* do -
# which ports it exposes, which capabilities it holds, which paths are writable,
# and what the risk score of that combination is. The analyzer computes it from
# the live cluster and from the learned profiles, and it does so whether or not
# anything is being enforced.
#
# That distinction matters when reading the numbers. A container with a perfect
# learned baseline and zero denials can still have a large attack surface,
# because the surface is about what the pod spec and the image grant, not about
# what the workload has used. Enforcement narrows what is used; it does not
# narrow what is granted. Narrowing what is granted is the pod spec's job, which
# is what the surface report is for.
---
apiVersion: policy.pahlevan.io/v1alpha1
kind: PahlevanPolicy
metadata:
  name: attack-surface-visibility
  namespace: default
  labels:
    app.kubernetes.io/name: attack-surface-visibility
    app.kubernetes.io/component: security-policy
  annotations:
    policy.pahlevan.io/description: >-
      Learns and reports without enforcing, so the attack surface can be
      measured before anything is constrained.
spec:
  selector:
    matchLabels:
      security.pahlevan.io/analyze: "true"

  learningConfig:
    duration: "30m"
    minSamples: 200
    autoTransition: false

  enforcementConfig:
    mode: Monitoring

---
# Reading the results.
#
#   kubectl get attacksurfaces
#   kubectl describe attacksurface attack-surface-visibility
#
# The metrics the analyzer publishes, and what each answers:
#
#   pahlevan_exposed_syscalls{criticality}   how much of the syscall surface is
#                                            reachable, split by how dangerous
#   pahlevan_exposed_ports{protocol}         listening ports per workload
#   pahlevan_writable_paths{path_type}       writable filesystem surface
#   pahlevan_capabilities_granted            capabilities held, not capabilities used
#   pahlevan_vulnerability_score             the combined score
#
# These are gauges. They deliberately do not carry a _total suffix, which is
# reserved for monotonic counters: rate() over a gauge of "how many ports are
# open" produces a number with no meaning, and the suffix is what invites
# someone to write it.
#
# A ConfigMap holding a PrometheusRule for the surface metrics. The thresholds
# are starting points; what matters is that they alert on a *change* in granted
# surface rather than on an absolute value, because the absolute value is a
# property of the image and changes when the image does.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pahlevan-attack-surface-alerts
  namespace: pahlevan-system
  labels:
    app.kubernetes.io/part-of: pahlevan
data:
  rules.yaml: |
    groups:
    - name: pahlevan.attack-surface
      rules:
      - alert: PahlevanAttackSurfaceGrew
        # A workload whose granted capability count goes up between two image
        # revisions is the signal. The absolute count is a property of the
        # image; the increase is a decision somebody made.
        expr: |
          increase(pahlevan_capabilities_granted[1h]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: More capabilities granted to {{ $labels.container_id }}
          description: >-
            The container now holds capabilities it did not hold an hour ago.
            This is a pod-spec change, not runtime behavior: enforcement will
            not narrow it, because it is about what is granted rather than what
            is used.

      - alert: PahlevanHighVulnerabilityScore
        expr: pahlevan_vulnerability_score > 8
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: High attack-surface score for {{ $labels.container_id }}
          description: >-
            Exposed ports, writable paths and granted capabilities combine to a
            score above 8. Read the AttackSurface object for the breakdown; the
            fix is usually in the pod spec rather than in a Pahlevan policy.
