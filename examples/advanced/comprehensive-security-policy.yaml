# Every field the CRD actually has, in one policy, with what each one does.
#
# This is a reference rather than something to apply as-is: a real policy uses
# the handful of fields its workload needs. It exists because the alternative -
# reading the Go types - is not a reasonable ask, and because a policy that
# sets a field the API does not have is silently pruned by the API server. You
# get no error, and the setting simply is not there.
#
# Some fields below are marked INERT. They are accepted by the API and acted on
# by nothing, and they are shown here precisely because they are the ones you
# cannot otherwise tell apart from the fields that work: the policy applies, the
# status goes green, and the setting does nothing. Run
#
#   pahlevan policy explain -f your-policy.yaml
#
# against your own policy and it will name every one of them. No other example
# in this directory sets an inert field.
apiVersion: policy.pahlevan.io/v1alpha1
kind: PahlevanPolicy
metadata:
  name: comprehensive-reference
  namespace: default
  labels:
    app.kubernetes.io/name: comprehensive-reference
    app.kubernetes.io/component: security-policy
  annotations:
    policy.pahlevan.io/description: "Reference: every supported field with its effect"
spec:
  # --- which workloads -------------------------------------------------------
  # Standard Kubernetes label selector semantics. Both forms may be combined;
  # they are ANDed.
  selector:
    matchLabels:
      app: reference-app
    matchExpressions:
    - key: environment
      operator: In
      values: ["staging", "production"]
    - key: security.pahlevan.io/exempt
      operator: DoesNotExist

  # --- how long to watch -----------------------------------------------------
  learningConfig:
    # Total observation before the container may transition.
    duration: "15m"
    # INERT. The adaptive controller observes continuously rather than in
    # sampling windows, and the only code that reads this is not built into the
    # agent.
    windowSize: "1m"
    # Minimum observations before the profile is considered meaningful. A
    # container that sat idle through the window has learned nothing, and
    # enforcing an empty baseline would deny everything.
    minSamples: 500
    # Flip to the configured mode automatically when the window elapses.
    autoTransition: true
    # INERT. Displayed and stored, acted on by nothing - a restarted container
    # gets a new cgroup id and therefore a new baseline regardless.
    lifecycleAware: true

  # --- what to do about the rest ---------------------------------------------
  enforcementConfig:
    # Off: the policy governs nothing, and nothing is learned.
    # Monitoring: observations and would-have-denied counts, no denials.
    # Blocking: the kernel refuses with EPERM.
    mode: Blocking

    # Default-deny of unlearned behavior is the only enforcement this data plane
    # performs, so setting this false under Blocking is a contradiction. The
    # controller downgrades to Monitoring and says so on the status rather than
    # enforcing something the author asked not to.
    blockUnknown: true

    # Suppresses denial while keeping everything else identical, which is what
    # makes a staged rollout possible. See examples/advanced/production-policy.yaml.
    alertOnly: false

    # Time after the transition during which denials are recorded but tolerated.
    # Covers cold-start behavior that the steady state does not repeat.
    gracePeriod: "60s"

    # Behavior the operator knows is legitimate but the window may not have
    # captured. This is not a workaround for a bad baseline: it is how knowledge
    # the observation window structurally cannot contain gets in.
    exceptions:
    - type: File          # File | Network | Syscall
      patterns:
      - "/var/run/secrets/kubernetes.io/serviceaccount/*"
      reason: "Projected token, refreshed on the kubelet's schedule"
    - type: Network
      patterns:
      - "10.96.0.10:53"
      reason: "Cluster DNS"
    - type: Syscall
      patterns:
      - "fallocate"
      reason: "Only issued during a checkpoint"
      # An exception that expires. Useful during a migration: it stops being an
      # exception on its own rather than living forever because nobody removed
      # it.
      temporary: true
      expiresAt: "2027-01-01T00:00:00Z"

  # --- file access -----------------------------------------------------------
  filePolicy:
    # Grants both read and write.
    allowedPaths:
    - "/app/data"
    # Revokes both, even if the path was learned.
    deniedPaths:
    - "/etc/shadow"
    - "/root/.ssh"
    # Grants the read and revokes the write. The two are separate entries in the
    # kernel allow-set, so this is a real distinction rather than a label: a
    # workload that read /etc/passwd at startup does not thereby get to write it.
    readOnlyPaths:
    - "/etc/config"
    - "/usr/share/app"
    writeAllowedPaths:
    - "/tmp"
    - "/var/log/app"
    # INERT, and redundant rather than merely unimplemented: default-deny of
    # unlearned behavior is what enforcement *is*, so Deny is already the
    # behavior under Blocking and Allow is what Monitoring means. The field
    # cannot express a third thing.
    defaultAction: Deny
    executableFilter:
      allowedExecutables:
      - "/usr/local/bin/app"
      deniedExecutables:
      - "/bin/sh"
      - "/usr/bin/curl"
      # INERT. Nothing verifies executable signatures, and the kernel hook has
      # no way to.
      requireSignature: false

  # --- syscalls, capabilities and who may exec -------------------------------
  syscallPolicy:
    # These adjust the generated seccomp profile rather than a BPF map: syscall
    # filtering is enforced by seccomp, while the BPF syscall program observes.
    allowedSyscalls:
    - "openat"
    - "read"
    - "write"
    deniedSyscalls:
    - "ptrace"
    - "init_module"
    defaultAction: Deny

    # Capabilities the workload may use, enforced by the lsm/capable hook. The
    # CAP_ prefix is optional.
    capabilityFilter:
    - "CAP_NET_BIND_SERVICE"
    - "CHOWN"

    # Constrains who may exec, as opposed to what may be exec'd. Each dimension
    # is opt-in; an unspecified one is not enforced, because reading "no parents
    # listed" as "an empty allow-list" would deny every exec in the container.
    # See examples/policies/process-filter.yaml for the full treatment.
    processFilter:
      commands:                 # absolute paths; become exec allow-set entries
      - "/usr/local/bin/app"
      users:                    # numeric uids; a name cannot be resolved from the node
      - "10001"
      groups:                   # numeric gids
      - "10001"
      parentProcesses:          # matched on comm, so the first 15 characters
      - "tini"

  # --- egress ----------------------------------------------------------------
  networkPolicy:
    # Egress is enforced by the socket_connect LSM hook. Ingress rules are
    # accepted by the API and reported as unenforced: inbound connections are
    # the CNI's business, and claiming otherwise would be a policy that looks
    # applied and is not.
    egressRules:
    - protocols: ["TCP"]
      peers:
      - ipBlock:
          cidr: "10.0.0.0/8"
          except:
          - "10.0.5.0/24"
      ports:
      - port: 443
        protocol: TCP
      - startPort: 8000
        endPort: 8100
        protocol: TCP
      action: Allow
    defaultAction: Deny
    # Convenience toggles for the two destinations nearly every workload needs
    # and nearly every learning window happens to miss.
    allowLoopback: true
    allowDNS: true

  # --- when the baseline turns out to be wrong -------------------------------
  selfHealing:
    enabled: true
    # Denials within the window that trigger a return to learning.
    rollbackThreshold: 5
    # Only the interval right after the transition is examined, because that is
    # where a breakage is attributable to enforcement. Past it the baseline is
    # settled, so an attacker cannot un-enforce a container by making noise.
    rollbackWindow: "10m"
    # Rollback is implemented. Relax and Maintenance are accepted and reported
    # as unimplemented rather than quietly behaving like Rollback.
    recoveryStrategy: Rollback

  # --- telemetry -------------------------------------------------------------
  #
  # INERT, the whole block. The agent's metrics, tracing and logging are
  # configured by its flags - --observability-exports, --otlp-endpoint,
  # --metrics-detail - and apply to the whole node rather than per policy. See
  # examples/observability/lgtm-stack.yaml for the configuration that works.
  observabilityConfig:
    metrics:
      enabled: true
      interval: "30s"
      exporters:
      - type: "prometheus"
    tracing:
      enabled: true
      samplingRate: "0.1"
      exporter:
        type: "otlp"
        endpoint: "otel-collector.pahlevan-system.svc:4317"
    logging:
      level: "info"
      format: "json"
      outputs:
      - type: "stdout"
    visualization:
      enabled: true
      updateInterval: "5m"
