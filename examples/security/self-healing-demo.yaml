# Self-healing: what happens when the learned baseline is wrong.
#
# It will be wrong sometimes. That is not a defect in the model, it is the model:
# a baseline is a summary of what a workload did during one window, and any
# window can miss something the workload genuinely needs. A tool that learns and
# then enforces without a way back is a tool that eventually causes an outage
# nobody can explain.
#
# So the agent watches the interval right after enforcement begins. If denials
# accumulate faster than a threshold, the container goes back to learning. The
# specifics are the interesting part:
#
#   - Only the ObservationWindow immediately after the transition is examined.
#     That is the interval in which a breakage is attributable to enforcement.
#     Past it the baseline is treated as settled, so a container that runs fine
#     for an hour and then gets denied is NOT un-enforced - otherwise an
#     attacker could roll back enforcement simply by making noise.
#
#   - The rollback is recorded and counted. pahlevan_rollbacks_total going up is
#     a signal that learning windows are too short for this workload, not a
#     background process quietly covering for a misconfiguration.
#
#   - Each rollback increments an attempt counter. A container that rolls back
#     repeatedly is telling you the workload is not a fit for blocking mode,
#     and the right response is to read the profile rather than to raise the
#     threshold.
---
apiVersion: policy.pahlevan.io/v1alpha1
kind: PahlevanPolicy
metadata:
  name: self-healing-demo
  namespace: default
  labels:
    app.kubernetes.io/name: self-healing-demo
    app.kubernetes.io/component: security-policy
  annotations:
    policy.pahlevan.io/description: >-
      Deliberately short learning window, so the baseline is likely to be
      incomplete and the rollback path actually fires.
spec:
  selector:
    matchLabels:
      app: self-healing-demo

  learningConfig:
    # Short on purpose. A minute is not enough for most workloads, which is the
    # point: this policy exists to make the rollback happen so you can watch it.
    duration: "1m"
    autoTransition: true

  enforcementConfig:
    mode: Blocking
    blockUnknown: true
    gracePeriod: "15s"

  selfHealing:
    enabled: true
    # Two denials is a low bar. In production this is 3-10 depending on how
    # noisy the workload is; here it is low so the demo does not require
    # patience.
    rollbackThreshold: 2
    # The window is the attributability interval described above, not a
    # rate-limit. Denials outside it do not roll anything back.
    rollbackWindow: "3m"
    # Rollback is the only strategy the controller implements. Relax and
    # Maintenance are accepted by the API and reported as unimplemented on the
    # policy status rather than silently behaving like Rollback - a strategy
    # that claims to do something else and does not is worse than one that says
    # so.
    recoveryStrategy: Rollback

---
# A workload that will trip it.
#
# The container sleeps through the learning window doing nothing, so the
# baseline is nearly empty. Then it starts touching files and running commands -
# behavior that is perfectly ordinary and entirely unlearned. Enforcement denies
# it, the denials accumulate, and self-healing returns the container to
# learning.
#
# Watch it happen:
#   kubectl logs -n pahlevan-system -l app.kubernetes.io/name=pahlevan-agent -f | grep -i rollback
#   kubectl get containerprofiles -w
apiVersion: apps/v1
kind: Deployment
metadata:
  name: self-healing-demo
  namespace: default
  labels:
    app: self-healing-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: self-healing-demo
  template:
    metadata:
      labels:
        app: self-healing-demo
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: app
        image: busybox:1.36
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop: ["ALL"]
        command: ["/bin/sh", "-c"]
        args:
        - |
          # Quiet through the learning window: the baseline learns almost
          # nothing.
          sleep 90
          # Then behave normally. Every one of these is unlearned, so every one
          # is denied, and the denial rate crosses the threshold.
          while true; do
            cat /etc/hostname   >/dev/null 2>&1 || true
            ls /var             >/dev/null 2>&1 || true
            date                >/dev/null 2>&1 || true
            sleep 5
          done
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 32Mi
