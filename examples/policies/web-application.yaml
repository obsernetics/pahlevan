# A web tier: predictable, network-facing, and the usual first thing an
# attacker reaches.
#
# Web applications are the easiest case for a learned baseline. They do the same
# few things forever - accept a connection, read a template, query a backend -
# so a short window converges, and anything outside it is genuinely anomalous.
# That is why the learning duration here is minutes rather than hours.
apiVersion: policy.pahlevan.io/v1alpha1
kind: PahlevanPolicy
metadata:
  name: web-application-policy
  namespace: default
  labels:
    app.kubernetes.io/name: web-application-policy
    app.kubernetes.io/component: security-policy
    workload-type: web-application
  annotations:
    policy.pahlevan.io/description: "Frontend and API workloads serving HTTP/HTTPS"
    policy.pahlevan.io/use-case: "React/Vue frontends, Express/Spring APIs, NGINX"
    policy.pahlevan.io/risk-level: "medium"
spec:
  selector:
    matchLabels:
      tier: frontend
    matchExpressions:
    - key: security.policy.pahlevan.io/enabled
      operator: In
      values: ["true", "enforce"]

  learningConfig:
    # Short, because a web app under traffic exercises nearly all of its
    # behavior within the first few minutes. A longer window here buys almost
    # nothing and delays enforcement.
    duration: "5m"
    minSamples: 150
    autoTransition: true
    # Restarts and rolling updates are part of normal life for a web deployment;
    # lifecycleAware keeps a rollout from looking like new behavior.

  enforcementConfig:
    mode: Blocking
    blockUnknown: true
    # A web app's first request after a cold start touches paths the steady
    # state never does - template caches, JIT artifacts. The grace period covers
    # that without widening the baseline.
    gracePeriod: "60s"
    exceptions:
    # Rolling updates re-read TLS material on start. Learned or not, this is
    # legitimate and predictable, so it is stated rather than left to chance.
    - type: File
      patterns:
      - "/etc/ssl/certs/*"
      - "/var/run/secrets/kubernetes.io/serviceaccount/*"
      reason: "TLS trust store and projected service account token, read at startup"

  filePolicy:
    # readOnlyPaths grants the read and denies the write. The distinction is
    # real in the kernel: reads and writes are separate allow-set entries, so a
    # workload that read /etc/passwd at startup does not thereby get to write it.
    readOnlyPaths:
    - "/etc/nginx"
    - "/usr/share/nginx/html"
    writeAllowedPaths:
    - "/var/cache/nginx"
    - "/tmp"
    deniedPaths:
    - "/etc/shadow"
    - "/root"
    - "/var/run/docker.sock"
    executableFilter:
      # A web server execs almost nothing. Naming what it does exec means an
      # injected command is refused even if the learning window happened to
      # catch it once.
      allowedExecutables:
      - "/usr/sbin/nginx"
      - "/docker-entrypoint.sh"
      deniedExecutables:
      - "/bin/sh"
      - "/bin/bash"
      - "/usr/bin/curl"
      - "/usr/bin/wget"

  networkPolicy:
    # Egress only. The socket_connect LSM hook governs outbound connections;
    # inbound is the kubelet's and the CNI's business, and a rule here saying
    # otherwise would be recorded and never enforced.
    allowDNS: true
    allowLoopback: true
    egressRules:
    - peers:
      - ipBlock:
          cidr: "10.0.0.0/8"
      ports:
      - port: 443
        protocol: TCP
      - port: 8080
        protocol: TCP
      action: Allow

  syscallPolicy:
    # Denied outright regardless of the baseline. A web server has no business
    # tracing another process or loading a kernel module, and if the learning
    # window somehow captured one, that is a reason to deny it explicitly rather
    # than to trust the window.
    deniedSyscalls:
    - "ptrace"
    - "init_module"
    - "finit_module"
    - "kexec_load"

  selfHealing:
    enabled: true
    # Three denials inside five minutes of enforcing means the baseline missed
    # something the workload needs. Rolling back to learning is cheaper than an
    # outage, and the rollback is itself an event worth investigating.
    rollbackThreshold: 3
    rollbackWindow: "5m"
    recoveryStrategy: Rollback
