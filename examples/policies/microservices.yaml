# Service-to-service traffic, where the interesting question is egress.
#
# A microservice's file and exec behavior is usually trivial - one static binary
# reading one config file - so the learned baseline there converges in seconds
# and is not where the value is. The value is in the network: a service that has
# only ever spoken to three peers should not suddenly reach a fourth, and that
# is precisely what a compromised service does.
#
# Two policies, because a mesh sidecar and the application it fronts have
# nothing in common behaviorally and should not share a baseline.
---
apiVersion: policy.pahlevan.io/v1alpha1
kind: PahlevanPolicy
metadata:
  name: microservice-policy
  namespace: default
  labels:
    app.kubernetes.io/name: microservice-policy
    app.kubernetes.io/component: security-policy
    workload-type: microservice
  annotations:
    policy.pahlevan.io/description: "Go/Java/Node services talking to each other"
    policy.pahlevan.io/risk-level: "medium"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: microservice

  learningConfig:
    duration: "10m"
    minSamples: 300
    autoTransition: true

  enforcementConfig:
    mode: Blocking
    blockUnknown: true
    gracePeriod: "30s"
    exceptions:
    - type: Network
      patterns:
      - "10.96.0.10:53"
      reason: "Cluster DNS, which a service may not have queried during the window"

  networkPolicy:
    allowDNS: true
    allowLoopback: true
    egressRules:
    # In-cluster peers on the usual service ports.
    - peers:
      - ipBlock:
          cidr: "10.0.0.0/8"
      ports:
      - port: 8080
        protocol: TCP
      - port: 9090
        protocol: TCP
      - port: 443
        protocol: TCP
      action: Allow
    # Everything else is refused. This is the line that matters: the default is
    # what governs the destination nobody thought of.

  filePolicy:
    readOnlyPaths:
    - "/etc/config"
    - "/var/run/secrets/kubernetes.io/serviceaccount"
    writeAllowedPaths:
    - "/tmp"
    deniedPaths:
    - "/var/run/docker.sock"
    - "/var/lib/kubelet"
    - "/proc/sys"
    executableFilter:
      deniedExecutables:
      # A statically linked service execs nothing. Denying the shells makes a
      # command-injection bug fail at the first step rather than the second.
      - "/bin/sh"
      - "/bin/bash"
      - "/usr/bin/curl"
      - "/usr/bin/wget"
      - "/usr/bin/nc"

  syscallPolicy:
    deniedSyscalls:
    - "ptrace"
    - "init_module"
    - "mount"
    - "pivot_root"

  selfHealing:
    enabled: true
    rollbackThreshold: 5
    rollbackWindow: "10m"
    recoveryStrategy: Rollback

---
# The sidecar. Separate policy, because a proxy legitimately dials everything
# the application does plus the control plane, and folding the two together
# would widen the application's baseline to match the proxy's.
apiVersion: policy.pahlevan.io/v1alpha1
kind: PahlevanPolicy
metadata:
  name: mesh-sidecar-policy
  namespace: default
  annotations:
    policy.pahlevan.io/description: >-
      Envoy or Linkerd sidecars. Wider egress than the application, and no
      exec at all after startup.
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: mesh-sidecar

  learningConfig:
    duration: "15m"
    autoTransition: true

  enforcementConfig:
    mode: Blocking
    blockUnknown: true
    gracePeriod: "60s"

  networkPolicy:
    allowDNS: true
    allowLoopback: true
    egressRules:
    - peers:
      - ipBlock:
          cidr: "10.0.0.0/8"
      ports:
      # A proxy's port set is genuinely wide. Enumerating a range is fine; the
      # controller expands it into allow-set entries, and warns if a range is
      # wide enough to evict the rest of the map.
      - startPort: 8000
        endPort: 8999
        protocol: TCP
      - port: 15012
        protocol: TCP
      action: Allow

  filePolicy:
    readOnlyPaths:
    - "/etc/istio"
    - "/var/run/secrets"
    writeAllowedPaths:
    - "/var/lib/istio"
    - "/tmp"

  syscallPolicy:
    processFilter:
      # After startup a proxy execs nothing at all. Restricting the parent to
      # the entrypoint means an exec from inside the proxy - which is what an
      # RCE in the proxy produces - is refused.
      parentProcesses:
      - "pilot-agent"

  selfHealing:
    enabled: true
    rollbackThreshold: 5
    rollbackWindow: "10m"
