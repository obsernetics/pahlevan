# A database: long-lived, stateful, and the workload where a false denial is
# most expensive.
#
# Databases are the hard case for a learned baseline, for a specific reason:
# their rare operations are their most important ones. Backup, WAL archival,
# replica promotion, vacuum, crash recovery - each touches paths and syscalls
# the steady state never does, and each happens on a schedule measured in hours
# or in incidents. A learning window that only saw normal queries produces a
# baseline that blocks the backup at 02:00.
#
# Two things follow, and they are the whole difference between this policy and
# the web-application one:
#
#   1. A long learning window, so the periodic work has a chance to run inside
#      it. Ten minutes is not enough; this uses an hour and still names the
#      rare paths explicitly rather than trusting the window to catch them.
#   2. No autoTransition. Enforcement on a database should begin when a human
#      has looked at the learned profile, not when a timer expired.
apiVersion: policy.pahlevan.io/v1alpha1
kind: PahlevanPolicy
metadata:
  name: database-policy
  namespace: default
  labels:
    app.kubernetes.io/name: database-policy
    app.kubernetes.io/component: security-policy
    workload-type: database
  annotations:
    policy.pahlevan.io/description: "PostgreSQL/MySQL and similar stateful data stores"
    policy.pahlevan.io/risk-level: "high"
    policy.pahlevan.io/note: >-
      autoTransition is deliberately false. Review the learned ContainerProfile
      and switch the mode to Blocking by hand.
spec:
  selector:
    matchLabels:
      tier: database

  learningConfig:
    # An hour, so at least one checkpoint and one WAL rotation land inside the
    # window. Even so, see the exceptions below: backup usually will not.
    duration: "1h"
    minSamples: 1000
    autoTransition: false

  enforcementConfig:
    # Start in Monitoring. Flipping to Blocking is a deliberate act after the
    # profile has been read, and the denial counters in Monitoring tell you
    # exactly what Blocking would have cost.
    mode: Monitoring
    gracePeriod: "5m"
    exceptions:
    # The operations that will not appear in any reasonable learning window.
    # Naming them is not a workaround: it is the operator supplying knowledge
    # the observation window structurally cannot contain.
    - type: File
      patterns:
      - "/var/lib/postgresql/data/pg_wal/*"
      - "/var/lib/postgresql/data/base/*"
      - "/var/lib/postgresql/backup/*"
      reason: "WAL archival and base backup, which run on a schedule outside the window"
    - type: File
      patterns:
      - "/var/lib/postgresql/data/pg_stat_tmp/*"
      reason: "Statistics collector, rewritten on a timer"
    - type: Syscall
      patterns:
      - "fallocate"
      - "fdatasync"
      reason: "Only issued during checkpoint and WAL preallocation"

  filePolicy:
    writeAllowedPaths:
    - "/var/lib/postgresql/data"
    - "/var/run/postgresql"
    - "/tmp"
    readOnlyPaths:
    - "/etc/postgresql"
    - "/usr/share/postgresql"
    deniedPaths:
    # A database process reading the node's kubelet directory or another
    # container's secrets is not a corner case of normal operation.
    - "/var/lib/kubelet"
    - "/root/.ssh"
    - "/etc/shadow"
    executableFilter:
      allowedExecutables:
      - "/usr/lib/postgresql/16/bin/postgres"
      - "/usr/lib/postgresql/16/bin/pg_basebackup"
      - "/usr/lib/postgresql/16/bin/pg_archivecleanup"
      - "/bin/sh"
      deniedExecutables:
      - "/usr/bin/curl"
      - "/usr/bin/wget"
      - "/usr/bin/nc"

  networkPolicy:
    allowLoopback: true
    allowDNS: true
    egressRules:
    # Replication to peers, and nothing else. A database that starts dialling
    # the internet is either exfiltrating or compromised.
    - peers:
      - ipBlock:
          cidr: "10.0.0.0/8"
      ports:
      - port: 5432
        protocol: TCP
      action: Allow

  syscallPolicy:
    deniedSyscalls:
    - "ptrace"
    - "process_vm_readv"
    - "process_vm_writev"
    - "init_module"
    - "kexec_load"
    processFilter:
      # Only the supervisor and the postmaster start anything. A shell launched
      # by a SQL injection has neither comm, so its exec is refused even though
      # /bin/sh is in the allow-set above for legitimate maintenance.
      parentProcesses:
      - "postgres"
      - "docker-entrypoint"

  selfHealing:
    enabled: true
    # Higher than the web tier: a database under an unusual but legitimate load
    # can trip a few denials without the baseline being wrong, and rolling a
    # database back to learning is itself disruptive.
    rollbackThreshold: 10
    rollbackWindow: "15m"
    recoveryStrategy: Rollback
