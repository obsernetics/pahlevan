# Jobs and CronJobs, where the learning model's assumption breaks.
#
# Every other policy here assumes a long-lived process: learn for a while, then
# enforce for the rest of its life. A batch job runs for ninety seconds and
# exits. Learn for five minutes and the job is over before enforcement starts;
# learn for ten seconds and the baseline is whatever the job happened to do
# while it was starting up.
#
# The way out is that batch jobs repeat. The learned profile of yesterday's run
# is the right baseline for today's, because it is the same image doing the same
# work. So the pattern is:
#
#   1. Run the job under Monitoring for a few cycles. Each run contributes to
#      the profile for that workload.
#   2. Read the profile. A batch job's behavior is small enough to read.
#   3. Switch to Blocking. Subsequent runs are enforced from the first syscall,
#      because the baseline already exists when the pod starts.
#
# That is why this file has two policies rather than one, and why the second is
# the one you eventually run.
---
apiVersion: policy.pahlevan.io/v1alpha1
kind: PahlevanPolicy
metadata:
  name: batch-job-learning
  namespace: default
  labels:
    app.kubernetes.io/name: batch-job-learning
    app.kubernetes.io/component: security-policy
    workload-type: batch
  annotations:
    policy.pahlevan.io/description: "Phase one: accumulate a profile across several runs"
    policy.pahlevan.io/risk-level: "low"
spec:
  selector:
    matchLabels:
      workload-type: batch
      security.pahlevan.io/phase: learning

  learningConfig:
    # Longer than any single run. The window is not "how long to watch this
    # pod"; it is "how long before we consider the workload's profile settled",
    # and for a job that runs hourly that is several hours.
    duration: "6h"
    windowSize: "1m"
    minSamples: 50
    # Never automatic here. The transition happens by relabelling the workload
    # onto the second policy, after a human has read the profile.
    autoTransition: false
    lifecycleAware: true

  enforcementConfig:
    mode: Monitoring

  filePolicy:
    # Even while only monitoring, these are worth stating: they are what the
    # would-have-denied counters are measured against, and a batch job reading
    # the kubelet directory is a finding on run one, not after the baseline has
    # quietly absorbed it.
    deniedPaths:
    - "/var/lib/kubelet"
    - "/root/.ssh"
    - "/etc/shadow"

  selfHealing:
    enabled: false
---
# Phase two. Same workload, relabelled, now enforced.
apiVersion: policy.pahlevan.io/v1alpha1
kind: PahlevanPolicy
metadata:
  name: batch-job-enforcing
  namespace: default
  labels:
    app.kubernetes.io/name: batch-job-enforcing
    app.kubernetes.io/component: security-policy
    workload-type: batch
  annotations:
    policy.pahlevan.io/description: >-
      Phase two: the profile already exists, so a short window suffices and the
      job is enforced almost from process start.
spec:
  selector:
    matchLabels:
      workload-type: batch
      security.pahlevan.io/phase: enforcing

  learningConfig:
    # Short, because the profile is not being built from scratch. This window
    # covers the container's own startup, which differs between runs in ways
    # that do not matter.
    duration: "30s"
    autoTransition: true
    lifecycleAware: true

  enforcementConfig:
    mode: Blocking
    blockUnknown: true
    # A job that is killed by a false denial cannot be retried into success -
    # it will fail identically every time. The grace period is generous for
    # that reason.
    gracePeriod: "45s"
    exceptions:
    - type: File
      patterns:
      - "/tmp/*"
      - "/var/tmp/*"
      reason: "Scratch space, whose exact filenames differ between runs"

  filePolicy:
    writeAllowedPaths:
    - "/tmp"
    - "/var/tmp"
    - "/data/output"
    readOnlyPaths:
    - "/data/input"
    - "/etc/config"
    deniedPaths:
    - "/var/lib/kubelet"
    - "/root/.ssh"
    - "/etc/shadow"

  networkPolicy:
    allowDNS: true
    egressRules:
    - peers:
      - ipBlock:
          cidr: "10.0.0.0/8"
      ports:
      - port: 443
        protocol: TCP
      - port: 5432
        protocol: TCP
      action: Allow
    defaultAction: Deny

  syscallPolicy:
    deniedSyscalls:
    - "ptrace"
    - "init_module"
    - "mount"

  selfHealing:
    # Low threshold and a short window: a batch job that starts being denied is
    # a job that is about to fail, and there is no steady state to wait for.
    enabled: true
    rollbackThreshold: 2
    rollbackWindow: "2m"
    recoveryStrategy: Rollback

  observabilityConfig:
    metrics:
      enabled: true
      interval: "15s"
