{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "pahlevan.fullname" . }}-agent
  labels:
    {{- include "pahlevan.labels" . | nindent 4 }}
rules:
- apiGroups: ["policy.pahlevan.io"]
  resources: ["pahlevanpolicies", "containerprofiles", "attacksurfaces"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["policy.pahlevan.io"]
  resources: ["pahlevanpolicies/status", "containerprofiles/status", "attacksurfaces/status"]
  verbs: ["get", "update", "patch"]
- apiGroups: ["policy.pahlevan.io"]
  resources: ["containerprofiles"]
  verbs: ["create", "update", "patch"]
- apiGroups: [""]
  resources: ["pods", "nodes"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "pahlevan.fullname" . }}-agent
  labels:
    {{- include "pahlevan.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "pahlevan.fullname" . }}-agent
subjects:
- kind: ServiceAccount
  name: {{ include "pahlevan.agentServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "pahlevan.fullname" . }}-operator
  labels:
    {{- include "pahlevan.labels" . | nindent 4 }}
rules:
- apiGroups: ["policy.pahlevan.io"]
  resources: ["pahlevanpolicies", "containerprofiles", "attacksurfaces"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["policy.pahlevan.io"]
  resources: ["pahlevanpolicies/status", "containerprofiles/status", "attacksurfaces/status"]
  verbs: ["get", "update", "patch"]
- apiGroups: [""]
  resources: ["pods", "nodes", "namespaces"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
- apiGroups: ["admissionregistration.k8s.io"]
  resources: ["validatingadmissionpolicies", "validatingadmissionpolicybindings"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "pahlevan.fullname" . }}-operator
  labels:
    {{- include "pahlevan.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "pahlevan.fullname" . }}-operator
subjects:
- kind: ServiceAccount
  name: {{ include "pahlevan.operatorServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "pahlevan.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pahlevan.labels" . | nindent 4 }}
rules:
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "pahlevan.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pahlevan.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "pahlevan.fullname" . }}-leader-election
subjects:
- kind: ServiceAccount
  name: {{ include "pahlevan.operatorServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
