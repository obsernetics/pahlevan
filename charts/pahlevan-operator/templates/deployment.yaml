{{- if .Values.operator.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pahlevan.fullname" . }}-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pahlevan.labels" . | nindent 4 }}
    app.kubernetes.io/name: pahlevan-operator
    app.kubernetes.io/component: control-plane
spec:
  replicas: {{ .Values.operator.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: pahlevan-operator
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "pahlevan.labels" . | nindent 8 }}
        app.kubernetes.io/name: pahlevan-operator
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: control-plane
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.metrics.port | quote }}
        prometheus.io/path: /metrics
        {{- with .Values.operator.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "pahlevan.operatorServiceAccountName" . }}
      hostUsers: {{ .Values.operator.hostUsers }}
      {{- with .Values.operator.priorityClassName }}
      # While no replica holds the lease, no PahlevanPolicy is reconciled. An
      # operator with no priority class is an ordinary Burstable pod and gets
      # evicted under node pressure ahead of workloads that declared one.
      priorityClassName: {{ . }}
      {{- end }}
      # Covers controller-runtime's 30s graceful shutdown plus the 5s
      # observability flush. A SIGKILL before the manager stops also skips the
      # leader-election release, so the standby waits out the whole lease with
      # nothing reconciling.
      terminationGracePeriodSeconds: {{ .Values.operator.terminationGracePeriodSeconds }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: operator
        image: {{ include "pahlevan.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: ["/usr/local/bin/pahlevan-operator"]
        args:
        - --leader-elect={{ .Values.operator.leaderElect }}
        - --metrics-bind-address=:{{ .Values.metrics.port }}
        - --health-probe-bind-address=:{{ .Values.health.port }}
        - --observability-exports={{ .Values.observability.exports }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop:
              - ALL
        resources:
          {{- toYaml .Values.operator.resources | nindent 10 }}
        ports:
        - name: metrics
          containerPort: {{ .Values.metrics.port }}
        - name: health
          containerPort: {{ .Values.health.port }}
        # The probe server does not bind until mgr.Start, which is after the
        # caches are built. On a cluster whose API server is slow to serve the
        # initial list, or one where the CRDs were applied moments earlier and
        # are not established yet, that outlasts three liveness failures and
        # the kubelet killed an operator that was starting normally.
        startupProbe:
          httpGet:
            path: /healthz
            port: health
          periodSeconds: {{ .Values.operator.startupProbe.periodSeconds }}
          failureThreshold: {{ .Values.operator.startupProbe.failureThreshold }}
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          periodSeconds: 20
          # 1s (the default) is shorter than a GC pause on a cluster-sized
          # cache, and a timed-out liveness probe is a kill.
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          # This is what the PodDisruptionBudget counts as available, so a
          # replica that is not serving must not report ready.
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
      # preferred, not required: a single-node cluster must still be able to
      # run both replicas, and a required rule leaves the second one Pending
      # there forever. The PodDisruptionBudget covers the case where the
      # preference was not honoured and both landed together.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: pahlevan-operator
              topologyKey: kubernetes.io/hostname
      {{- with .Values.operator.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.operator.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
