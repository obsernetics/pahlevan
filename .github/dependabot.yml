# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Go modules
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    reviewers:
      - "obsernetics/maintainers"
    assignees:
      - "obsernetics/maintainers"
    commit-message:
      prefix: "deps"
      include: "scope"

  # Docker dependencies
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    reviewers:
      - "obsernetics/maintainers"
    assignees:
      - "obsernetics/maintainers"
    commit-message:
      prefix: "deps"
      include: "scope"

  # The VM smoke test is its own Go module, so the entry above does not reach
  # it. It sat on a golang.org/x/sys with a known advisory while the root module
  # was four minors ahead, and nothing reported it because no updater was
  # looking at this directory.
  - package-ecosystem: "gomod"
    directory: "/hack/vm/smoke"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    reviewers:
      - "obsernetics/maintainers"
    assignees:
      - "obsernetics/maintainers"
    commit-message:
      prefix: "deps"
      include: "scope"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    reviewers:
      - "obsernetics/maintainers"
    assignees:
      - "obsernetics/maintainers"
    commit-message:
      prefix: "deps"
      include: "scope"
