name: DCO

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, edited]

# Re-pushing a branch supersedes the previous check; the old one's verdict is
# about commits that no longer exist.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dco-check:
    name: Signed-off-by
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The whole history of the branch, so every commit in the PR range is
          # available to inspect. This is the only checkout in the
          # repository that genuinely needs it - `git rev-list BASE..HEAD` cannot resolve a range across
          # a shallow boundary - and the job still finishes in about 13s, so
          # there is nothing here to trade away.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Fetch base branch
        run: git fetch --no-tags origin "${BASE_SHA}"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}

      - name: Verify every commit is signed off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Merge commits are exempt: they are generated, not authored, and
          # carry no new contribution to certify.
          commits="$(git rev-list --no-merges "${BASE_SHA}..${HEAD_SHA}")"

          if [ -z "${commits}" ]; then
            echo "No non-merge commits in this pull request. Nothing to check."
            exit 0
          fi

          failed=0

          for sha in ${commits}; do
            subject="$(git log -1 --format='%s' "${sha}")"
            author_name="$(git log -1 --format='%an' "${sha}")"
            author_email="$(git log -1 --format='%ae' "${sha}")"
            expected="Signed-off-by: ${author_name} <${author_email}>"

            # All Signed-off-by trailers on the commit, whitespace normalized.
            signoffs="$(git log -1 --format='%B' "${sha}" \
              | grep -i '^ *Signed-off-by:' \
              | sed -e 's/^ *//' -e 's/ *$//' -e 's/  */ /g' || true)"

            if [ -z "${signoffs}" ]; then
              echo "::error::${sha} (${subject}): missing a Signed-off-by trailer."
              echo "  Expected: ${expected}"
              failed=1
              continue
            fi

            # A bot's sign-off is matched on name only.
            #
            # Dependabot authors its commits as
            #   dependabot[bot] <49699333+dependabot[bot]@users.noreply.github.com>
            # and signs them off as
            #   Signed-off-by: dependabot[bot] <support@github.com>
            #
            # Those two addresses are both GitHub's and neither is choosable, so
            # an exact match can never pass. Twelve dependency pull requests were
            # closed unmerged because of it and the updates were then redone by
            # hand in batch branches. The DCO exists so a human certifies the
            # origin of their contribution; an account that cannot type has
            # nothing to certify, and the trailer GitHub attaches is a formality.
            # So for a [bot] author the name must still match, which keeps one
            # bot from signing off another's work, and the address is not
            # compared. Human commits are unaffected.
            expected_match="${expected}"
            case "${author_name}" in
              *'[bot]')
                expected_match="Signed-off-by: ${author_name} <"
                if printf '%s\n' "${signoffs}" | grep -qiF "${expected_match}"; then
                  echo "ok  ${sha}  ${subject}  (bot sign-off, name matched)"
                  continue
                fi
                echo "::error::${sha} (${subject}): no Signed-off-by naming the bot author."
                echo "  Expected a trailer beginning: ${expected_match}"
                echo "  Found:"
                printf '%s\n' "${signoffs}" | sed 's/^/    /'
                failed=1
                continue
                ;;
            esac

            # The author's own sign-off must be present. Extra trailers from
            # co-authors or from a rebase are fine and are ignored.
            if printf '%s\n' "${signoffs}" \
              | grep -qiFx "${expected}"; then
              echo "ok  ${sha}  ${subject}"
            else
              echo "::error::${sha} (${subject}): Signed-off-by does not match the commit author."
              echo "  Expected: ${expected}"
              echo "  Found:"
              printf '%s\n' "${signoffs}" | sed 's/^/    /'
              failed=1
            fi
          done

          if [ "${failed}" -ne 0 ]; then
            echo ""
            echo "-----------------------------------------------------------"
            echo "This project requires the Developer Certificate of Origin"
            echo "(DCO) on every commit. See https://developercertificate.org/"
            echo "and CONTRIBUTING.md."
            echo ""
            echo "Sign off new commits with:"
            echo "    git commit -s"
            echo ""
            echo "Fix the most recent commit:"
            echo "    git commit --amend -s --no-edit"
            echo "    git push --force-with-lease"
            echo ""
            echo "Fix every commit on this branch:"
            echo "    git rebase --signoff main"
            echo "    git push --force-with-lease"
            echo ""
            echo "The sign-off name and email must match the commit author."
            echo "-----------------------------------------------------------"
            exit 1
          fi

          echo "All commits are signed off."
