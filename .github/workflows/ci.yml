name: CI

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

env:
  GO_VERSION: "1.25.13"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Cache Go modules
      uses: actions/cache@v5
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-mod-

    - name: Cache Go build
      uses: actions/cache@v5
      with:
        path: ~/.cache/go-build
        key: ${{ runner.os }}-go-build-${{ hashFiles('**/*.go') }}
        restore-keys: |
          ${{ runner.os }}-go-build-

    # The eBPF Go bindings and their embedded objects are committed, so no
    # clang/bpf2go codegen is needed here. Regenerate out-of-band with `make ebpf`.
    - name: Build binaries
      run: |
        go build -o bin/pahlevan-agent ./cmd/pahlevan-agent
        go build -o bin/pahlevan-operator ./cmd/pahlevan-operator
        go build -o bin/pahlevan ./cmd/pahlevan

    # The build alone never caught a regression. Vet, test, race, and format are
    # what actually gate quality, so they run here rather than only locally.
    - name: Vet
      run: go vet ./...

    - name: Test
      run: go test -count=1 -coverprofile=coverage.out ./...

    - name: Test (race)
      run: go test -count=1 -race ./...

    - name: Check formatting
      run: |
        unformatted=$(gofmt -l $(git ls-files '*.go' | grep -v zz_generated))
        if [ -n "$unformatted" ]; then
          echo "These files are not gofmt-clean:"; echo "$unformatted"; exit 1
        fi

    - name: Coverage summary
      run: go tool cover -func=coverage.out | tail -1

    # arm64 is a supported target claim, so prove it still compiles.
    - name: Cross-compile arm64
      run: GOOS=linux GOARCH=arm64 go build ./...

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: binaries
        path: bin/

  push-image:
    name: Push to GHCR
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to GHCR
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata (tags, labels)
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          # {{branch}} is only non-empty on a push to a branch. On a tag push
          # and on a pull_request it expands to nothing, producing the invalid
          # tag ":-<sha>" and failing the whole build. Gating on ref_type alone
          # was not enough: a pull_request has ref_type 'branch' but no branch
          # name, so the PR case still broke. Everything that is not a branch
          # push gets the plain sha- prefix.
          type=sha,prefix={{branch}}-,enable=${{ github.event_name == 'push' && github.ref_type == 'branch' }}
          type=sha,prefix=sha-,enable=${{ !(github.event_name == 'push' && github.ref_type == 'branch') }}
          type=raw,value=latest,enable={{is_default_branch}}
          # Version tags (v2.0.0) publish 2.0.0, 2.0, 2 and the raw tag name.
          type=ref,event=tag
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        # arm64 is a supported target: the agent ships per-arch BPF objects.
        platforms: linux/amd64,linux/arm64
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          COMMIT=${{ github.sha }}
          DATE=${{ github.event.head_commit.timestamp }}

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build, push-image]
    # Only on version tags (e.g. v0.1.0). Previously this ran on every push to
    # main and used the commit SHA as the tag, which GitHub rejects (40/64-hex
    # names are forbidden) - failing CI on every merge.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Publish release with install.yaml
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: ${{ github.ref_name }}
        generate_release_notes: true
        files: install.yaml
