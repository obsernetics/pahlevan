name: CI

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

# A second push to the same branch used to leave the first one running: two
# 13-minute pipelines competing for the same runners, and the older one's
# result meaningless the moment it finished. Tags are their own ref, so a
# release run can never be cancelled by a later push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.26.7"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Pinned by version AND by digest: the tarball is fetched from the release
  # page rather than compiled, so the checksum is what makes that safe.
  ACTIONLINT_VERSION: "1.7.12"
  ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
  # Nothing in this module reads debug.ReadBuildInfo's VCS stamps - the version
  # string comes from -ldflags in the Dockerfile - so stamping only costs a git
  # invocation per main package, and it is the one thing that can fail on the
  # shallow clones below.
  GOFLAGS: "-buildvcs=false"

jobs:
  # Everything below used to run on every commit, including commits that only
  # touched prose. A README fix cost the full 13-minute pipeline.
  #
  # This is a job rather than a workflow-level `paths-ignore:` on purpose. A
  # path-filtered workflow does not run at all, so its required status check
  # never reports and a branch-protected pull request waits for it forever.
  # Filtering here keeps the "CI" gate below reporting on every commit while
  # the expensive jobs skip.
  #
  # It asks the API instead of using a path-filter action so that it needs no
  # checkout at all: ~5 seconds, against the ~25 seconds a clone of this
  # repository's 254MB of history costs.
  changes:
    name: Detect what changed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Classify the changed paths
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -uo pipefail

          # Every unknown answers "run everything". Skipping the pipeline
          # because a lookup failed is how an unbuildable commit reaches main.
          run_everything() {
            echo "$1"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          }

          # A tag push publishes an image and a release, whatever it touched.
          if [ "${REF_TYPE}" = "tag" ]; then
            run_everything "Tag push: building and publishing regardless of the diff."
          fi

          case "${EVENT_NAME}" in
            pull_request)
              files="$(gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/files" \
                --jq '.[].filename')" \
                || run_everything "Could not list the pull request's files."
              ;;
            push)
              # The first push to a new branch has an all-zero "before".
              case "${BEFORE_SHA}" in
                ""|0000000000000000000000000000000000000000)
                  run_everything "No previous commit to compare against."
                  ;;
              esac
              files="$(gh api "repos/${REPO}/compare/${BEFORE_SHA}...${HEAD_SHA}" \
                --jq '.files[]?.filename')" \
                || run_everything "Could not compare ${BEFORE_SHA}...${HEAD_SHA}."
              ;;
            *)
              run_everything "Event ${EVENT_NAME} is not filtered."
              ;;
          esac

          [ -n "${files}" ] || run_everything "Empty diff; not guessing."

          echo "Changed files:"
          printf '%s\n' "${files}" | sed 's/^/  /'

          # Prose only: nothing here can change a compiled binary or the
          # image. hack/ is Go and .github/workflows/ is what actionlint
          # reads, so neither is listed.
          #
          # docs/, pages/ and CHANGELOG.md ARE listed even though
          # hack/sitegen and hack/pagesync read them in their tests. That gap
          # is closed in pages.yml, which triggers on exactly those paths and
          # runs `go test ./hack/...` there - the docs-shaped tests run in the
          # docs-shaped workflow instead of dragging the whole Go suite,
          # the race detector and a two-architecture image build along with a
          # typo fix. Keep the two lists in step.
          if printf '%s\n' "${files}" \
            | grep -qvE '^(docs/|pages/|\.github/ISSUE_TEMPLATE/|[^/]+\.md$|LICENSE$|CODEOWNERS$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "Result: code changed, running the full pipeline."
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Result: documentation only, skipping the compile and test jobs."
          fi

  # The five jobs below were one serial job that took ~6m20s. They share no
  # state, so running them concurrently turns that sum into its largest term.
  # They all restore the same cache, keyed identically by ./.github/actions/go-setup.

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      # Only the working tree is needed. Full history on this repository is
      # 254MB; depth 1 is a few hundred KB.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Go
        uses: ./.github/actions/go-setup
        with:
          go-version: ${{ env.GO_VERSION }}

      # `go build ./...` rather than just the three commands: it is what makes
      # this job a trustworthy gate for push-image, and the extra packages are
      # nearly free once their dependencies are compiled.
      - name: Compile every package
        run: go build ./...

      # The eBPF Go bindings and their embedded objects are committed, so no
      # clang/bpf2go codegen is needed here. Regenerate out-of-band with
      # `make ebpf`.
      - name: Build binaries
        run: |
          go build -o bin/pahlevan-agent ./cmd/pahlevan-agent
          go build -o bin/pahlevan-operator ./cmd/pahlevan-operator
          go build -o bin/pahlevan ./cmd/pahlevan

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: bin/

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Go
        uses: ./.github/actions/go-setup
        with:
          go-version: ${{ env.GO_VERSION }}

      # -p is left at its default, which is GOMAXPROCS, which is the hosted
      # runner's 4 vCPUs. Forcing it higher does not help: 40 test packages
      # against 4 cores is already saturated, and each extra concurrent package
      # brings its own compile and its own envtest-shaped memory, so the run
      # gets slower and flakier rather than faster.
      - name: Test
        run: go test -count=1 -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

  test-race:
    name: Test (race)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Go
        uses: ./.github/actions/go-setup
        with:
          go-version: ${{ env.GO_VERSION }}

      # The longest of the Go jobs at ~2m45s. On its own runner that is now
      # spent in parallel with the other four rather than added to them.
      - name: Test (race)
        run: go test -count=1 -race ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Go
        uses: ./.github/actions/go-setup
        with:
          go-version: ${{ env.GO_VERSION }}

      # The build alone never caught a regression. Vet, test, race, and format
      # are what actually gate quality.
      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          # Piped into xargs rather than substituted into gofmt's arguments:
          # the unquoted substitution split on whitespace, so a path containing
          # a space would have been checked as two files that do not exist.
          unformatted=$(git ls-files '*.go' | grep -v zz_generated | xargs -r gofmt -l)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi

      # A workflow with a malformed expression does not fail loudly: GitHub
      # reports the run under the file's path instead of its name, ends it in
      # zero seconds, and every job it was supposed to gate simply never
      # appears. That is indistinguishable from a workflow that passed, which
      # is how a broken `${{ ... }}` reached main once already.
      #
      # `go install actionlint@v1.7.12` compiled the tool from source on every
      # run. Measured cold, that is 15s on a 12-core machine and proportionally
      # worse on a 4-vCPU runner; the release tarball takes 0.3s. It is not
      # cached either, because an actions/cache restore plus save round-trip
      # costs several seconds more than simply downloading it again. The
      # version and the SHA-256 are both pinned in `env:` above, so this is
      # still a fixed artifact and not an unpinned installer piped into a
      # shell.
      - name: Install actionlint
        run: |
          set -euo pipefail
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL --retry 3 -o "${RUNNER_TEMP}/${tarball}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${RUNNER_TEMP}/${tarball}" | sha256sum -c -
          # Unpacked into RUNNER_TEMP rather than /usr/local/bin: no sudo, and
          # nothing is left behind on a self-hosted runner.
          tar -xzf "${RUNNER_TEMP}/${tarball}" -C "${RUNNER_TEMP}" actionlint
          "${RUNNER_TEMP}/actionlint" --version

      - name: Lint the workflows
        run: |
          "${RUNNER_TEMP}/actionlint" -color

      # The "CI" gate below is meant to be the one check branch protection
      # requires, so a bug that lets it pass while a job is red is invisible
      # by construction: nothing else is watching. These
      # cases feed the gate's own script contrived job results and assert the
      # exit codes, on every run, for about a second.
      - name: Prove the CI gate fails when a dependency fails
        run: bash .github/actions/require-success/selftest.sh

      # The other half of the gate's correctness: the logic is only as good as
      # the list it is given. A job added to this file but forgotten in the
      # gate's `needs:` can fail with the required check still green.
      - name: Check the CI gate depends on every job
        run: |
          set -euo pipefail
          # PyYAML ships on the hosted image, but a self-hosted runner is not
          # a reason for this check to go red on something unrelated.
          python3 -c "import yaml" 2>/dev/null || pip install --quiet pyyaml
          python3 - <<'EOF'
          import sys, yaml
          jobs = yaml.safe_load(open(".github/workflows/ci.yml"))["jobs"]
          declared = set(jobs["ci"]["needs"])
          expected = set(jobs) - {"ci"}
          missing = expected - declared
          extra = declared - expected
          if missing:
              print(f"::error::the CI gate does not depend on: {sorted(missing)}")
          if extra:
              print(f"::error::the CI gate depends on jobs that do not exist: {sorted(extra)}")
          sys.exit(1 if (missing or extra) else 0)
          EOF
          echo "The CI gate depends on every job in the workflow."

  cross-compile:
    name: Cross-compile arm64
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Go
        uses: ./.github/actions/go-setup
        with:
          go-version: ${{ env.GO_VERSION }}

      # arm64 is a supported target claim, so prove it still compiles. It costs
      # ~80s because the arm64 objects are a separate build cache from the
      # amd64 ones every other job warms - which is exactly why it belongs on
      # its own runner instead of at the end of the serial chain.
      - name: Cross-compile arm64
        run: GOOS=linux GOARCH=arm64 go build ./...

  push-image:
    name: Push to GHCR
    runs-on: ubuntu-latest
    # Was `needs: build` on the whole monolith, so the image waited out the
    # tests, the race detector and the arm64 build - about five minutes - even
    # though it recompiles everything inside Docker anyway.
    #
    # The dependency is not dropped entirely. The Dockerfile does compile from
    # source today, so a broken commit could not produce a pushed image even
    # with no `needs:` at all - but that is a property of a file another team
    # owns, and it would disappear the day the Dockerfile starts COPYing
    # prebuilt binaries. Depending on `build` states the guarantee here, costs
    # about a minute of latency, and saves a ~6-minute two-architecture Docker
    # build on every commit that does not compile.
    #
    # `build` is skipped on a documentation-only change, which skips this job
    # too: republishing a byte-identical image for a README fix is pure cost.
    needs: build
    permissions:
      contents: read
      packages: write
      # Keyless signing. The job mints a short-lived OIDC token, Fulcio
      # exchanges it for a certificate that expires in ten minutes, and that
      # certificate - not a key anyone holds - is what binds the signature to
      # this repository and this workflow file.
      #
      # The alternative is a long-lived cosign private key in repository
      # secrets, and that key is in exactly the same compromise class as the
      # registry token this whole exercise exists to defend against: anyone
      # who exfiltrates it can sign an image that verifies perfectly and
      # forever, with nothing in the signature to say it was not produced
      # here. A Fulcio certificate cannot be replayed a day later.
      id-token: write
      # actions/attest-build-provenance writes the provenance statement
      # through GitHub's attestations API, which needs its own scope.
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The build context is the working tree; .dockerignore excludes .git
          # entirely, so history would be fetched only to be thrown away.
          fetch-depth: 1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            # {{branch}} is only non-empty on a push to a branch. On a tag push
            # and on a pull_request it expands to nothing, producing the invalid
            # tag ":-<sha>" and failing the whole build. Gating on ref_type alone
            # was not enough: a pull_request has ref_type 'branch' but no branch
            # name, so the PR case still broke. Everything that is not a branch
            # push gets the plain sha- prefix.
            type=sha,prefix={{branch}}-,enable=${{ github.event_name == 'push' && github.ref_type == 'branch' }}
            type=sha,prefix=sha-,enable=${{ !(github.event_name == 'push' && github.ref_type == 'branch') }}
            type=raw,value=latest,enable={{is_default_branch}}
            # Version tags (v3.0.0) publish 3.0.0, 3.0, 3 and the raw tag name.
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # arm64 is a supported target: the agent ships per-arch BPF objects.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache in the Actions cache service. mode=max stores the
          # intermediate builder stages too, so `go mod download` is reused
          # across runs instead of re-fetching the module graph twice (once per
          # architecture) on every build.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.head_commit.timestamp }}

      # Everything below runs on version tags only. A branch build publishes
      # tags that move - `main`, `latest`, and on the default branch those are
      # rewritten on every merge - so a signature on one of them would attest
      # to whatever happened to be there at signing time and say nothing about
      # what somebody pulls an hour later. A release tag is the immutable
      # thing worth binding an identity to.
      #
      # cosign is pinned to an exact release rather than floated. cosign 3
      # changed the default on-registry layout for signatures and
      # attestations, so the installed version is what decides whether the
      # `cosign verify` invocation printed in docs/packages.md is the correct
      # one. A silent bump there turns working documentation into a support
      # thread.
      - name: Install cosign
        if: github.ref_type == 'tag'
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.0.6

      # Signed by digest, never by tag. A tag is a mutable pointer: signing
      # `:v3.4.1` would leave whoever can push to the registry free to move
      # that tag onto a different image, while the old signature sits in the
      # registry still looking valid to anyone who verifies the tag.
      - name: Sign the image
        if: github.ref_type == 'tag'
        env:
          IMAGE_DIGEST: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE_DIGEST}"

      # SPDX rather than CycloneDX: SPDX 2.3 is the ISO/IEC 5962 standard
      # document format, `cosign attest --type spdxjson` names it natively so
      # the attestation carries a well-known predicate type instead of a
      # custom one, and GitHub's own dependency tooling ingests it. Nothing
      # published here needs what CycloneDX adds on top - VEX statements and
      # service/dependency modelling - so the standardised format wins.
      #
      # syft is pointed at the pushed multi-architecture index and resolves it
      # to the runner's own platform, so this SBOM describes the linux/amd64
      # image. docs/packages.md says so rather than letting an arm64 operator
      # assume otherwise.
      - name: Generate the image SBOM
        if: github.ref_type == 'tag'
        uses: anchore/sbom-action@v0.24.2
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          # The release job attaches this to the GitHub release; the action's
          # own artifact upload would just be a second copy under a name
          # nobody looks for.
          upload-artifact: false

      # Attested to the image as well as attached to the release, because the
      # two reach different people. Someone auditing a running cluster has a
      # digest and no idea which GitHub release it came from; the attestation
      # travels with the image and answers them without a second lookup.
      - name: Attest the SBOM to the image
        if: github.ref_type == 'tag'
        env:
          IMAGE_DIGEST: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign attest --yes --type spdxjson \
            --predicate sbom.spdx.json "${IMAGE_DIGEST}"

      - name: Upload the SBOM for the release job
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.spdx.json
          if-no-files-found: error

      # actions/attest-build-provenance rather than the SLSA generator
      # reusable workflow: the provenance is built by GitHub from this run's
      # own metadata and signed against the same Fulcio identity as everything
      # else in this job, so there is no second workflow to keep pinned and no
      # second signing identity that can drift away from the one documented in
      # docs/packages.md.
      - name: Attest build provenance for the image
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # One status check for branch protection to require, instead of six that
  # would each have to be listed and kept in sync as jobs are added or renamed.
  #
  # `if: always()` is what lets it report at all when a dependency is red - and
  # it is also why the job cannot just be empty: an always() job with no steps
  # passes. The action it calls fails unless every result is success or
  # skipped, and .github/actions/require-success/selftest.sh proves it.
  ci:
    name: CI
    runs-on: ubuntu-latest
    if: always()
    # Every other job in the file, `release` included. A job that is not a
    # dependency here is a job whose failure this check cannot see, so the
    # `lint` job asserts this list stays complete.
    needs: [changes, build, test, test-race, lint, cross-compile, push-image, release]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Require every job to have succeeded
        uses: ./.github/actions/require-success
        with:
          needs: ${{ toJSON(needs) }}

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build, push-image]
    # Only on version tags (e.g. v0.1.0). Previously this ran on every push to
    # main and used the commit SHA as the tag, which GitHub rejects (40/64-hex
    # names are forbidden) - failing CI on every merge.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      # Same reasoning as push-image: the release assets are signed against a
      # ten-minute Fulcio certificate instead of a private key parked in
      # repository secrets.
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Was fetch-depth: 0. Nothing here reads git history: the only file
          # published is the committed install.yaml, and generate_release_notes
          # is computed by the GitHub API from the tag, not from a local log.
          fetch-depth: 1

      - name: Download the image SBOM
        uses: actions/download-artifact@v7
        with:
          name: sbom

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          # Kept identical to push-image: one cosign version across the
          # release means one documented verification command.
          cosign-release: v3.0.6

      # The manifest needs the same provenance as the image it deploys.
      # docs/packages.md tells people to pipe this URL straight into
      # `kubectl apply`, which creates a privileged DaemonSet with CAP_BPF on
      # every node - so an unverifiable install.yaml is a larger hole than an
      # unverifiable image, not a smaller one.
      #
      # One SHA256SUMS covering every asset, and the signature over that file
      # rather than over each asset: one signature to check, and no way to
      # swap a single asset without breaking it.
      - name: Checksum the release assets
        run: |
          set -euo pipefail
          sha256sum install.yaml sbom.spdx.json > SHA256SUMS
          cat SHA256SUMS

      - name: Sign the checksums
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --bundle SHA256SUMS.cosign.bundle SHA256SUMS

      # install.yaml is attested directly as well. The checksum signature
      # proves the file came from this workflow; the provenance attestation
      # records which run, which commit and which source repository built it,
      # which is what an auditor asking "does this match the repo" needs.
      - name: Attest build provenance for the release assets
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: |
            install.yaml
            sbom.spdx.json

      - name: Publish release with install.yaml
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            install.yaml
            sbom.spdx.json
            SHA256SUMS
            SHA256SUMS.cosign.bundle
