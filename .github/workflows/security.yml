name: Security

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM

jobs:
  trivy:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Run Trivy scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload results
      uses: github/codeql-action/upload-sarif@v4
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  govulncheck:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup Go
      uses: actions/setup-go@v7
      with:
        go-version: "1.26.7"

    - name: Cache Go modules
      uses: actions/cache@v5
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-mod-

    - name: Cache Go tools
      uses: actions/cache@v5
      with:
        path: ~/go/bin
        key: ${{ runner.os }}-go-tools-${{ hashFiles('pkg/ebpf/bpf2go.go') }}
        restore-keys: |
          ${{ runner.os }}-go-tools-

    - name: Cache APT packages
      uses: actions/cache@v5
      with:
        path: |
          /var/cache/apt/archives
          /var/lib/apt/lists
        key: ${{ runner.os }}-apt-${{ hashFiles('.github/workflows/security.yml') }}
        restore-keys: |
          ${{ runner.os }}-apt-

    - name: Run govulncheck
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@latest

        # Retry only a failure to fetch the vulnerability database.
        #
        # govulncheck downloads its index from vuln.go.dev on every run, and
        # that fetch intermittently returns 403 from GitHub-hosted runners.
        # A security gate that goes red because a CDN rate-limited it teaches
        # everyone to ignore it, which is worse than not having the gate.
        #
        # Actual findings still fail the job on the first attempt: the retry
        # is gated on the fetch error message, and any other non-zero exit is
        # propagated immediately.
        for attempt in 1 2 3; do
          set +e
          out="$(govulncheck ./... 2>&1)"
          code=$?
          set -e
          echo "$out"
          if [ "$code" -eq 0 ]; then
            exit 0
          fi
          if ! printf '%s' "$out" | grep -q 'fetching vulnerabilities'; then
            echo "govulncheck reported findings; failing."
            exit "$code"
          fi
          echo "Could not reach the vulnerability database (attempt $attempt/3); retrying in $((attempt * 15))s."
          sleep $((attempt * 15))
        done
        echo "The vulnerability database was unreachable after 3 attempts."
        exit 1

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: go

    - name: Setup Go
      uses: actions/setup-go@v7
      with:
        go-version: "1.26.7"

    - name: Cache Go modules
      uses: actions/cache@v5
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-mod-

    - name: Cache Go build
      uses: actions/cache@v5
      with:
        path: ~/.cache/go-build
        key: ${{ runner.os }}-go-build-${{ hashFiles('**/*.go') }}
        restore-keys: |
          ${{ runner.os }}-go-build-

    - name: Cache Go tools
      uses: actions/cache@v5
      with:
        path: ~/go/bin
        key: ${{ runner.os }}-go-tools-${{ hashFiles('pkg/ebpf/bpf2go.go') }}
        restore-keys: |
          ${{ runner.os }}-go-tools-

    - name: Cache APT packages
      uses: actions/cache@v5
      with:
        path: |
          /var/cache/apt/archives
          /var/lib/apt/lists
        key: ${{ runner.os }}-apt-${{ hashFiles('.github/workflows/security.yml') }}
        restore-keys: |
          ${{ runner.os }}-apt-

    # Deliberately no cache of pkg/ebpf/*_bpf*.{go,o}: those files are committed
    # to the repo, so a cache can only ever restore stale copies alongside the
    # checked-out ones. A restore-keys fallback did exactly that after the
    # bindings were regenerated per-architecture, resurrecting the deleted
    # single-arch files and breaking the build with redeclaration errors.
    - name: Build
      run: go build ./...

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4