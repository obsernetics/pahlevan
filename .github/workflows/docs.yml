name: Documentation

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'README.md'
      - '*.md'
  pull_request:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'README.md'
      - '*.md'

# The path filters above already keep a Go-only change from starting this
# workflow. This keeps a second push to the same branch from linting a
# revision nobody is waiting on any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-docs:
    name: Lint Documentation
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '18'

    - name: Install markdownlint
      run: npm install -g markdownlint-cli

    - name: Lint Markdown files
      run: |
        markdownlint --config .markdownlint.yml '**/*.md' --ignore node_modules --ignore .git || true

    # Test fixtures are excluded. hack/sitegen/testdata holds markdown written
    # to exercise the generator, including deliberately broken and external
    # links, and a link checker that reads them fails on inputs that are doing
    # their job.
    - name: Check links in documentation
      uses: gaurav-nelson/github-action-markdown-link-check@v1
      with:
        use-quiet-mode: 'yes'
        use-verbose-mode: 'yes'
        config-file: '.markdown-link-check.json'
        folder-path: 'docs, .github'
        file-path: './README.md, ./CHANGELOG.md, ./ROADMAP.md, ./SECURITY.md, ./CONTRIBUTING.md'

  generate-docs:
    name: Generate API Documentation
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    # The shared composite, not a bare setup-go: `go install controller-gen`
    # below compiles controller-tools from source, and without the build cache
    # restored it does that from scratch on every run.
    - name: Set up Go
      uses: ./.github/actions/go-setup
      with:
        go-version: "1.26.7"

    - name: Install controller-gen
      run: go install sigs.k8s.io/controller-tools/cmd/controller-gen@v0.17.2

    - name: Generate CRD documentation
      run: |
        mkdir -p docs/api
        # Generate CRDs from the correct paths, allowing dangerous types if needed
        controller-gen crd:crdVersions=v1,allowDangerousTypes=true paths="./pkg/apis/..." output:crd:artifacts:config=docs/api/ || \
        controller-gen crd:crdVersions=v1,allowDangerousTypes=true paths="./api/..." output:crd:artifacts:config=docs/api/ || \
        echo "No CRD APIs found to generate documentation"

    - name: Generate Go documentation
      run: |
        mkdir -p docs/go
        # Generate Go package documentation
        go doc -all ./... > docs/go/packages.txt 2>/dev/null || echo "Go documentation generation completed"
        echo "# Go Package Documentation" > docs/go/README.md
        echo "This directory contains generated Go package documentation." >> docs/go/README.md

    - name: Show generated docs (no auto-commit)
      run: |
        echo "Generated documentation files:"
        ls -la docs/api/ docs/go/ 2>/dev/null || echo "No generated docs found"
        echo "Note: Auto-commit disabled to prevent permission issues"
