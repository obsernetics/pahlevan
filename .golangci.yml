# golangci-lint configuration.
#
# This file used to enable roughly eighty-five linters, including the whole
# opinionated style family. That was never a real gate: the pinned binary was
# built with Go 1.21 and could not read Go 1.25 export data, so `make lint`
# failed with typecheck errors before reaching a single rule. When it was first
# made to run it produced about 7,900 findings, 3,320 of them from wsl alone.
#
# A gate nobody can pass is the same class of problem as a metric that always
# reads zero: it looks like assurance and provides none. So the set below is
# the one that catches defects rather than expressing taste, and it passes
# clean. Formatting is handled by gofmt, which CI already enforces separately.
#
# Style linters deliberately not enabled, and why: wsl, nlreturn, whitespace
# (blank-line placement), godot (comment full stops), lll (line length),
# varnamelen, tagliatelle (JSON casing, which our CRDs must not change),
# mnd and goconst (literals), err113 (sentinel errors everywhere), wrapcheck,
# testpackage, gochecknoglobals and gochecknoinits (both load-bearing here:
# the eBPF metrics register in init and are package-level by necessity),
# ireturn, nonamedreturns, and the complexity family (cyclop, gocognit,
# gocyclo, maintidx, nestif). Re-enable any of them deliberately, with the
# findings fixed in the same change.
version: "2"

run:
  modules-download-mode: readonly
  tests: true

linters:
  # default: none means the list below is exactly what runs, rather than being
  # layered on top of a default set that changes between releases.
  default: none
  enable:
    # Correctness.
    - bodyclose
    - durationcheck
    - errcheck
    - errorlint
    - forcetypeassert
    - govet
    - ineffassign
    - loggercheck
    - makezero
    - nilerr
    - noctx
    - reassign
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unused
    - wastedassign

    # Correctness in tests specifically.
    - thelper
    - usetesting

    # Security.
    - gosec

    # Things that are almost always mistakes rather than preferences.
    - asciicheck
    - errname
    - gocheckcompilerdirectives
    - gomoddirectives
    - goprintffuncname
    - misspell
    - nosprintfhostport
    - predeclared
    - promlinter
    - unconvert
    - unparam
    - usestdlibvars

    # gocritic earns its place with the diagnostic and performance tags only;
    # its style and opinionated tags are what made the old config unusable.
    - gocritic

    # nolintlint keeps suppressions honest: an unused //nolint is a lie about
    # what the code needs.
    - nolintlint

  settings:
    errcheck:
      check-type-assertions: true
      # check-blank is deliberately off. It flags `_ = f()`, which is the
      # language's own way of saying "ignored on purpose"; with it on there is
      # no way to express that except a nolint on every line. It was run once
      # with check-blank enabled to audit the existing ignores, which is how the
      # dropped event-handler errors were found - those are now counted by
      # pahlevan_ebpf_handler_errors_total rather than discarded.
      check-blank: false

    gocritic:
      enabled-tags:
        - diagnostic
        - performance
      disabled-checks:
        # Fires on any if/else chain of three, which is idiomatic here.
        - ifElseChain
        # Reads arithmetic in a comment as code: "// (90 + 65 + 10) / 3 = 55.0"
        # next to the assertion it explains is exactly the comment we want.
        - commentedOutCode
        # hugeParam and rangeValCopy account for 137 of this linter's 156
        # findings, essentially all in CLI rendering and status aggregation
        # that runs once per command or once per reconcile. The hot paths that
        # actually matter (ring-buffer decode, event dispatch, denial
        # accounting) are benchmarked explicitly and are allocation-free;
        # rewriting 137 cold call sites to chase copies nobody has measured
        # would be churn with real regression risk.
        - hugeParam
        - rangeValCopy

    govet:
      # shadow is deliberately not enabled. It was run once over the tree and
      # produced 39 findings, every one of them either `if err := f(); err != nil`
      # - the idiom the standard library uses throughout - or a local named
      # after a package-level variable it intentionally replaces. Zero defects.
      # The Go team leaves shadow out of `go vet` by default for the same
      # reason; enabling it here would buy 39 permanent nolint comments on
      # correct code.
      enable: []

    misspell:
      locale: US

    nolintlint:
      allow-unused: false
      require-explanation: true
      require-specific: true

    staticcheck:
      checks:
        - all

  exclusions:
    generated: lax
    presets:
      - comments
      - std-error-handling
    rules:
      # Generated code is not ours to lint.
      - path: zz_generated\.
        linters: [errcheck, gocritic, gosec, govet, staticcheck, unparam, unused]
      - path: _bpf(el|eb)?\.go
        linters: [errcheck, gocritic, gosec, govet, staticcheck, unparam, unused]
      - path: \.pb\.go
        linters: [errcheck, gocritic, gosec, govet, staticcheck, unparam, unused]

      # Tests legitimately ignore returns they are not asserting on, and a test
      # helper that returns an unused value is usually deliberate.
      #
      # noctx: the VM suite shells out to qemu and ssh and dials the guest; the
      #   timeouts that matter there are the test's own, not a context.
      # promlinter: a test that registers a deliberately conflicting collector
      #   has to reuse the real metric's name - that is the thing under test.
      - path: _test\.go
        linters: [errcheck, gosec, unparam, forcetypeassert, noctx, promlinter]

      # G103: unsafe.Pointer is how BPF map keys and values are addressed.
      # G115: integer conversions are inherent to reading fixed-width kernel
      #       wire formats, where the widths are asserted by the decode tests.
      - linters: [gosec]
        text: "G(103|115)"

      # A //go:generate line is allowed to be long.
      - source: "^//go:generate "
        linters: [lll]

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/obsernetics/pahlevan
